<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KAMEL DERBY</title>
<style>
  :root {
    --bg:#120b1e; --panel:#1c1430; --panel2:#241b3a; --ink:#e8e0f0;
    --accent:#e8c83a; --border:#4a3550; --btn:#2b2140; --btn-hover:#3a2d55;
    --focus:#3ad8d8; --danger:#e84a3a;
  }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; height:100%; overflow:hidden;
    background:var(--bg); color:var(--ink);
    font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size:14px; }
  /* Full-viewport shell: the page itself never scrolls; only the panel may. */
  .app {
    height:100vh;                 /* fallback for browsers without dvh */
    height:100dvh;
    padding:12px;
    display:flex; flex-direction:column; overflow:hidden;
  }
  header { flex:0 0 auto; display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:10px; }
  h1 { font-size:18px; letter-spacing:2px; margin:0; color:var(--accent); }
  main { flex:1 1 auto; min-height:0; display:flex; gap:12px; align-items:stretch; }
  #canvasWrap { flex:1 1 auto; min-width:0; min-height:0; overflow:hidden;
    display:flex; align-items:center; justify-content:center; }
  canvas#game { display:block; box-sizing:content-box; image-rendering:pixelated; background:#000; border:2px solid var(--border); }
  #panel { flex:0 0 320px; width:320px; min-width:260px; height:100%; min-height:0;
    overflow-y:auto; background:var(--panel); border:2px solid var(--border); padding:10px; }
  .row { display:flex; align-items:center; gap:8px; margin-bottom:8px; flex-wrap:wrap; }
  label { font-size:13px; }
  input[type=number] { width:80px; background:var(--panel2); color:var(--ink);
    border:2px solid var(--border); padding:4px 6px; font:inherit; }
  input:disabled { opacity:.45; }
  button { background:var(--btn); color:var(--ink); border:2px solid var(--border);
    padding:4px 8px; font:inherit; cursor:pointer; border-radius:0; }
  button:hover:not(:disabled) { background:var(--btn-hover); }
  button:disabled { opacity:.45; cursor:not-allowed; }
  button[aria-pressed="true"] { background:var(--accent); color:#1a1208; }
  .lang button { min-width:44px; }
  :focus-visible { outline:2px solid var(--focus); outline-offset:1px; }
  .lane { border-top:2px solid var(--border); padding-top:8px; margin-top:8px; }
  .lane:first-child { border-top:0; padding-top:0; margin-top:0; }
  .lane .cname { display:inline-block; min-width:84px; font-weight:bold; }
  .lane .btns { display:inline-flex; gap:4px; margin:4px 0; }
  #validation { color:var(--danger); margin:6px 0 0; font-size:13px; }
  #live { position:absolute; width:1px; height:1px; margin:-1px; padding:0; border:0;
    overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
  /* Stack strictly below 900px so the panel sits beside the canvas at exactly 900px. */
  @media (max-width: 899.98px) {
    main { flex-direction: column; }
    #canvasWrap { flex:1 1 0; }
    #panel { flex:0 1 auto; width:100%; min-width:0; height:auto; max-height:45dvh; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1 id="title">KAMEL DERBY</h1>
    <div class="lang" role="group" aria-label="Language" id="languageToggle">
      <button id="lang-en" type="button" aria-pressed="true">EN</button>
      <button id="lang-de" type="button" aria-pressed="false">DE</button>
    </div>
  </header>
  <main>
    <div id="canvasWrap">
      <canvas id="game" width="512" height="288"
        aria-label="Camel race track. Camels race left to right to the goal."></canvas>
    </div>
    <aside id="panel" aria-label="Controls">
      <div class="row">
        <label for="camelCount" id="camelCountLabel">Camels</label>
        <input id="camelCount" type="number" min="2" max="8" step="1" value="4">
      </div>
      <div class="row">
        <label for="goalScore" id="goalLabel">Goal</label>
        <input id="goalScore" type="number" min="1" max="10000" step="1" value="200">
        <label for="infinite"><input id="infinite" type="checkbox"> <span id="infiniteText">∞</span></label>
      </div>
      <div id="laneControls"></div>
      <div class="row" style="margin-top:8px">
        <button id="newRace" type="button">New race</button>
      </div>
      <p id="validation" role="alert" hidden>Enter a whole number ≥ 0.</p>
    </aside>
  </main>
  <div id="live" aria-live="polite" role="status"></div>
</div>
<script id="core">
window.GameCore = (function () {
  'use strict';
  const PALETTE = ['#e84a3a', '#3a6ae8', '#3aa84a', '#e8c83a', '#9a4ae8', '#e88a3a', '#3ad8d8', '#e85a9a'];
  const MIN_CAMELS = 2, MAX_CAMELS = 8;
  // Custom lane names are session-only and never translated; defaults are the
  // same template in both languages so they read identically.
  const NAME_TEMPLATES = { en: 'Team {n}', de: 'Team {n}' };
  const NAME_MAX = 16;
  const GOAL_MIN = 1, GOAL_MAX = 10000;
  const PAD = 20, MIN_WINDOW = 100, GOAL_SLACK = 80;
  // Shared dune height field h(x): deterministic, no Math.random, amplitude
  // A1+A2 = 2 px, wavelengths 160/130 px. Same profile for every lane.
  const TERRAIN = { A1: 1.2, L1: 160, PH1: 0, A2: 0.8, L2: 130, PH2: 1.7 };
  function terrainHeightAt(x) {
    const px = (typeof x === 'number' && Number.isFinite(x)) ? x : 0;
    const h = TERRAIN.A1 * Math.sin(2 * Math.PI * px / TERRAIN.L1 + TERRAIN.PH1)
      + TERRAIN.A2 * Math.sin(2 * Math.PI * px / TERRAIN.L2 + TERRAIN.PH2);
    return Math.max(-2, Math.min(2, h));
  }
  // Walk animation keeps running this long after the last score change so a
  // full 4-frame cycle (4 x 320ms = 1280ms) always completes.
  const ANIM_MS = 1400;

  let clock = (typeof performance !== 'undefined' && performance.now)
    ? function () { return performance.now(); }
    : function () { return Date.now(); };

  const state = {
    camels: [],
    camelCount: 4,
    goalScore: 200,
    infinite: false,
    language: 'en',
    raceOver: false,
    winnerId: null,
  };

  const listeners = new Set();
  function subscribe(fn) { listeners.add(fn); return function () { listeners.delete(fn); }; }
  function emit() { for (const fn of listeners) fn(getState()); }

  function camelName(index, language) {
    const template = NAME_TEMPLATES[language] || NAME_TEMPLATES.en;
    return template.replace('{n}', String(index + 1));
  }

  function makeCamel(index, score) {
    return {
      id: 'camel-' + index,
      name: camelName(index, state.language),
      color: PALETTE[index % PALETTE.length],
      score: score,
      lane: index,
      animUntil: 0,
    };
  }

  function isValidScore(n) {
    return typeof n === 'number' && Number.isInteger(n) && n >= 0;
  }

  function findCamel(id) {
    for (const c of state.camels) if (c.id === id) return c;
    return null;
  }

  function rebuildCamels(count) {
    const next = [];
    for (let i = 0; i < count; i++) {
      const existing = state.camels[i];
      if (existing) {
        next.push({
          id: existing.id,
          name: existing.name,
          color: PALETTE[i % PALETTE.length],
          score: existing.score,
          lane: i,
          animUntil: existing.animUntil,
        });
      } else {
        next.push(makeCamel(i, 0));
      }
    }
    state.camels = next;
    state.camelCount = count;
  }

  function checkWinner() {
    if (state.raceOver || state.infinite || state.goalScore == null) return;
    for (const c of state.camels) {
      if (c.score >= state.goalScore) {
        state.raceOver = true;
        state.winnerId = c.id;
        return;
      }
    }
  }

  function addScore(camelId, n) {
    if (state.raceOver) return false;
    const c = findCamel(camelId);
    if (!c) return false;
    if (typeof n !== 'number' || !Number.isInteger(n) || n <= 0) return false;
    c.score += n;
    c.animUntil = clock() + ANIM_MS;
    checkWinner();
    emit();
    return true;
  }

  function setScore(camelId, n) {
    if (state.raceOver) return false;
    const c = findCamel(camelId);
    if (!c) return false;
    if (!isValidScore(n)) return false;
    c.score = n;
    c.animUntil = clock() + ANIM_MS;
    checkWinner();
    emit();
    return true;
  }

  function setCamelCount(n) {
    if (!Number.isInteger(n)) return false;
    const count = Math.max(MIN_CAMELS, Math.min(MAX_CAMELS, n));
    rebuildCamels(count);
    // If a shrink drops the winning camel, the race is void: no winner exists
    // in the remaining lanes, so unlock (scores and config otherwise untouched).
    if (state.raceOver && state.winnerId && !findCamel(state.winnerId)) {
      state.raceOver = false;
      state.winnerId = null;
      // A remaining camel may already be at/above a just-lowered goal.
      checkWinner();
    }
    emit();
    return true;
  }

  function setGoal(scoreOrNull) {
    if (scoreOrNull === null) {
      state.infinite = true;
      state.goalScore = null;
    } else {
      if (!Number.isInteger(scoreOrNull) || scoreOrNull < GOAL_MIN || scoreOrNull > GOAL_MAX) return false;
      state.infinite = false;
      state.goalScore = scoreOrNull;
      checkWinner();
    }
    emit();
    return true;
  }

  function resetRace() {
    for (const c of state.camels) { c.score = 0; c.animUntil = 0; }
    state.raceOver = false;
    state.winnerId = null;
    emit();
    return true;
  }

  function setLanguage(lang) {
    if (lang !== 'en' && lang !== 'de') return false;
    state.language = lang;
    // Lane names are session-only and never translated (custom names preserved).
    emit();
    return true;
  }

  // Rename a lane. Trims surrounding whitespace; rejects empty or >16-char
  // input without touching state. Names are session-only.
  function setCamelName(camelId, name) {
    const c = findCamel(camelId);
    if (!c) return false;
    if (typeof name !== 'string') return false;
    const trimmed = name.trim();
    if (trimmed.length === 0 || trimmed.length > NAME_MAX) return false;
    c.name = trimmed;
    emit();
    return true;
  }

  function setClock(fn) { clock = fn; }

  function getState() {
    return {
      camels: state.camels.map(function (c) {
        return { id: c.id, name: c.name, color: c.color, score: c.score, lane: c.lane, animUntil: c.animUntil };
      }),
      camelCount: state.camelCount,
      goalScore: state.goalScore,
      infinite: state.infinite,
      language: state.language,
      raceOver: state.raceOver,
      winnerId: state.winnerId,
    };
  }

  function computeCameraWindow(scores, goalScore) {
    if (!Array.isArray(scores) || scores.length === 0) return { min: 0, max: MIN_WINDOW };
    let minScore = Infinity, maxScore = -Infinity;
    for (const s of scores) {
      const v = (typeof s === 'number' && Number.isFinite(s)) ? s : 0;
      if (v < minScore) minScore = v;
      if (v > maxScore) maxScore = v;
    }
    const span = maxScore - minScore;
    const wMin = minScore - PAD;
    let wMax = Math.max(maxScore + PAD, wMin + MIN_WINDOW);
    if (goalScore != null && Number.isFinite(goalScore) && (goalScore - wMin) <= (span + GOAL_SLACK)) {
      wMax = Math.max(wMax, goalScore + PAD);
    }
    return { min: wMin, max: wMax };
  }

  function mapScoreToScreenX(score, window, canvasWidth) {
    const w = window || { min: 0, max: MIN_WINDOW };
    const width = (typeof canvasWidth === 'number' && canvasWidth > 0) ? canvasWidth : 512;
    const span = w.max - w.min;
    if (span <= 0) return 0;
    const x = ((score - w.min) / span) * width;
    return Math.max(0, Math.min(width, x));
  }

  rebuildCamels(state.camelCount);

  return {
    PALETTE: PALETTE,
    NAME_TEMPLATES: NAME_TEMPLATES,
    MIN_CAMELS: MIN_CAMELS, MAX_CAMELS: MAX_CAMELS,
    GOAL_MIN: GOAL_MIN, GOAL_MAX: GOAL_MAX,
    PAD: PAD, MIN_WINDOW: MIN_WINDOW, GOAL_SLACK: GOAL_SLACK, ANIM_MS: ANIM_MS,
    addScore: addScore, setScore: setScore, setCamelCount: setCamelCount,
    setGoal: setGoal, resetRace: resetRace, setLanguage: setLanguage,
    setCamelName: setCamelName, setClock: setClock, getState: getState,
    subscribe: subscribe, camelName: camelName,
    computeCameraWindow: computeCameraWindow,
    mapScoreToScreenX: mapScoreToScreenX, terrainHeightAt: terrainHeightAt,
  };
})();
</script>
<script id="app">
(function () {
  'use strict';
  const core = window.GameCore;

  const canvas = document.getElementById('game');
  const canvasWrap = document.getElementById('canvasWrap');
  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  const CANVAS_W = canvas.width;   // 512
  const CANVAS_H = canvas.height;  // 288

  const HORIZON_Y = 70;
  const LANE_BOTTOM = CANVAS_H - 4; // 284
  const SPRITE_W = 34;
  const SPRITE_H = 24;
  // Feet rest this many px above the lane bottom at terrain height 0.
  const TERRAIN_FEET_OFFSET = 2;
  const LANE_MARGIN = 2;
  // Unhurried Volksfest glide: each retarget tweens LERP_MS ease-out (cubic)
  // from the sprite's current position, so mid-flight retargets blend smoothly
  // instead of snapping. No artificial input-blocking delay.
  const LERP_MS = 900;
  // 4 walk frames x 320ms = 1280ms gait cycle; idle frame 0 when not animating.
  const ANIM_FRAME_MS = 320;
  const CANVAS_BORDER = 4; // 2px border on each side of the canvas
  // Fill the binding dimension of the wrapper, clamped to a sane range, then
  // snap to a crisp integer multiple only when the fit is already within 8% of
  // it AND the integer still fits (keeps 1x/2x/3x where it does).
  const SCALE_EPSILON = 0.05, SCALE_MAX = 4;
  const SNAP_TOLERANCE = 0.08;

  const runtime = {
    visualLeft: Object.create(null),
    motion: Object.create(null),
    lastWinnerId: null,
    confetti: [],
    frameWindow: null,
    finishVisible: false,
    goalScreenX: null,
    decorDrawn: 0,
    confettiDrawn: 0,
  };

  // ---------- canvas layout (fill the area; page never scrolls) ----------
  let canvasScale = 1;
  let lastCssW = -1, lastCssH = -1;
  let layoutPending = false;

  function computeScale(availW, availH) {
    const fit = Math.min(availW / CANVAS_W, availH / CANVAS_H);
    if (!(fit > 0)) return 0;
    // Cap only the upper bound: a minimum above the computed fit would force the
    // canvas wider than its wrapper (clipped by overflow:hidden). A tiny epsilon
    // guard keeps the canvas from collapsing to zero size.
    const capped = Math.min(SCALE_MAX, fit);
    const nearest = Math.round(capped);
    const snapFits = nearest * CANVAS_W <= availW && nearest * CANVAS_H <= availH;
    if (snapFits && Math.abs(capped - nearest) <= SNAP_TOLERANCE * nearest) {
      return nearest;
    }
    return Math.max(SCALE_EPSILON, capped);
  }

  function applyCanvasLayout() {
    layoutPending = false;
    const availW = canvasWrap.clientWidth - CANVAS_BORDER;
    const availH = canvasWrap.clientHeight - CANVAS_BORDER;
    if (availW <= 0 || availH <= 0) return;
    const scale = computeScale(availW, availH);
    if (!(scale > 0)) return;
    canvasScale = scale;
    const w = Math.floor(CANVAS_W * scale);
    const h = Math.floor(CANVAS_H * scale);
    if (w === lastCssW && h === lastCssH) return;
    lastCssW = w;
    lastCssH = h;
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
  }

  function requestLayout() {
    if (layoutPending) return;
    layoutPending = true;
    window.requestAnimationFrame(applyCanvasLayout);
  }

  function laneHeight(n) { return (LANE_BOTTOM - HORIZON_Y) / n; }
  function laneTopY(i, n) { return HORIZON_Y + i * laneHeight(n); }
  function laneBottomY(i, n) { return laneTopY(i, n) + laneHeight(n); }
  // Undulating sand surface for lane i at world position `score`.
  function laneSurfaceY(i, n, score) {
    return laneBottomY(i, n) - TERRAIN_FEET_OFFSET - Math.round(core.terrainHeightAt(score));
  }
  // Sprite top so the feet land on the surface, clamped inside the lane (an
  // 8-lane track is ~26.75 px tall, only ~2.75 px of slack for a 24 px sprite).
  function camelTopY(i, n, score) {
    const min = Math.round(laneTopY(i, n));
    const max = Math.round(laneBottomY(i, n) - SPRITE_H);
    const top = Math.round(laneSurfaceY(i, n, score) - SPRITE_H);
    return Math.max(min, Math.min(max, top));
  }
  function mapX(point, win) { return core.mapScoreToScreenX(point, win, CANVAS_W); }
  function camelTargetLeft(score, win) {
    const cx = mapX(score, win);
    return Math.max(LANE_MARGIN, Math.min(CANVAS_W - SPRITE_W - LANE_MARGIN, cx - SPRITE_W / 2));
  }
  function currentWindow(s) {
    return core.computeCameraWindow(s.camels.map(function (c) { return c.score; }), s.goalScore);
  }

  // ---------- i18n ----------
  const I18N = {
    en: {
      title: 'KAMEL DERBY',
      camelCountLabel: 'Camels',
      goalLabel: 'Goal',
      infiniteLabel: '∞',
      plus1: '+1', plus5: '+5', plus10: '+10',
      scoreLabel: 'Score',
      setButton: 'Set',
      newRace: 'New race',
      winnerBanner: '{name} wins!',
      teamLabel: 'Team',
      validationHint: 'Enter a whole number ≥ 0.',
      canvasLabel: 'Camel race track. Camels race left to right to the goal.',
    },
    de: {
      title: 'KAMEL DERBY',
      camelCountLabel: 'Kamele',
      goalLabel: 'Ziel',
      infiniteLabel: '∞',
      plus1: '+1', plus5: '+5', plus10: '+10',
      scoreLabel: 'Punktzahl',
      setButton: 'Setzen',
      newRace: 'Neues Rennen',
      winnerBanner: '{name} gewinnt!',
      teamLabel: 'Team',
      validationHint: 'Bitte eine ganze Zahl ≥ 0 eingeben.',
      canvasLabel: 'Kamelrennen. Kamele rennen von links nach rechts zum Ziel.',
    },
  };

  function t(lang, key, vars) {
    let str = I18N[lang][key];
    if (vars) {
      for (const k in vars) str = str.replace('{' + k + '}', String(vars[k]));
    }
    return str;
  }

  // ---------- UI controller ----------
  const camelCountEl = document.getElementById('camelCount');
  const goalEl = document.getElementById('goalScore');
  const infiniteEl = document.getElementById('infinite');
  const laneContainer = document.getElementById('laneControls');
  const validationEl = document.getElementById('validation');
  const liveEl = document.getElementById('live');
  let lastGoal = 200;
  let renderedCount = -1;

  function showValidation() { validationEl.hidden = false; }
  function hideValidation() { validationEl.hidden = true; }

  function buildLane(index) {
    const el = document.createElement('div');
    el.className = 'lane';
    el.dataset.index = String(index);

    const name = document.createElement('span');
    name.className = 'cname';
    name.setAttribute('data-name', '');

    const nameRow = document.createElement('div');
    nameRow.className = 'row';
    const nameLabel = document.createElement('label');
    nameLabel.setAttribute('data-name-label', '');
    nameLabel.setAttribute('for', 'name-' + index);
    const nameInput = document.createElement('input');
    nameInput.id = 'name-' + index;
    nameInput.type = 'text';
    nameInput.maxLength = 16;
    nameInput.setAttribute('data-name-input', '');
    nameRow.append(nameLabel, nameInput);

    const btns = document.createElement('div');
    btns.className = 'btns';
    for (const n of [1, 5, 10]) {
      const b = document.createElement('button');
      b.type = 'button';
      b.setAttribute('data-action', 'add');
      b.setAttribute('data-n', String(n));
      btns.appendChild(b);
    }

    const row = document.createElement('div');
    row.className = 'row';
    const label = document.createElement('label');
    label.setAttribute('data-score-label', '');
    label.setAttribute('for', 'exact-' + index);
    const input = document.createElement('input');
    input.id = 'exact-' + index;
    input.type = 'number';
    input.min = '0';
    input.step = '1';
    input.setAttribute('data-exact', '');
    input.value = '0';
    const set = document.createElement('button');
    set.type = 'button';
    set.setAttribute('data-action', 'set');
    row.append(label, input, set);

    el.append(name, nameRow, btns, row);
    return el;
  }

  function renderLanes(s) {
    if (renderedCount !== s.camels.length) {
      laneContainer.replaceChildren.apply(laneContainer, s.camels.map(function (c, i) { return buildLane(i); }));
      renderedCount = s.camels.length;
    }
    const lanes = laneContainer.querySelectorAll('.lane');
    s.camels.forEach(function (c, i) {
      const el = lanes[i];
      if (!el) return;
      const name = el.querySelector('[data-name]');
      name.textContent = c.name;
      name.style.color = c.color;
      el.querySelector('[data-name-label]').textContent = t(s.language, 'teamLabel');
      const nameInput = el.querySelector('[data-name-input]');
      // Never clobber the field while the user is typing in it.
      if (document.activeElement !== nameInput) nameInput.value = c.name;
      el.querySelector('[data-action="add"][data-n="1"]').textContent = t(s.language, 'plus1');
      el.querySelector('[data-action="add"][data-n="5"]').textContent = t(s.language, 'plus5');
      el.querySelector('[data-action="add"][data-n="10"]').textContent = t(s.language, 'plus10');
      el.querySelector('[data-score-label]').textContent = t(s.language, 'scoreLabel');
      el.querySelector('[data-action="set"]').textContent = t(s.language, 'setButton');
      el.querySelector('[data-exact]').value = String(c.score);
      const lock = s.raceOver;
      el.querySelectorAll('[data-action], [data-exact]').forEach(function (ctl) { ctl.disabled = lock; });
    });
  }

  function syncDom(s) {
    document.getElementById('title').textContent = t(s.language, 'title');
    document.getElementById('camelCountLabel').textContent = t(s.language, 'camelCountLabel');
    document.getElementById('goalLabel').textContent = t(s.language, 'goalLabel');
    document.getElementById('infiniteText').textContent = t(s.language, 'infiniteLabel');
    document.getElementById('newRace').textContent = t(s.language, 'newRace');
    document.getElementById('lang-en').setAttribute('aria-pressed', String(s.language === 'en'));
    document.getElementById('lang-de').setAttribute('aria-pressed', String(s.language === 'de'));
    canvas.setAttribute('aria-label', t(s.language, 'canvasLabel'));
    validationEl.textContent = t(s.language, 'validationHint');

    camelCountEl.value = String(s.camelCount);
    infiniteEl.checked = s.infinite;
    goalEl.disabled = s.infinite;
    if (!s.infinite && s.goalScore != null) goalEl.value = String(s.goalScore);

    renderLanes(s);
    if (s.raceOver && s.winnerId) {
      const idx = s.camels.findIndex(function (c) { return c.id === s.winnerId; });
      if (idx < 0) {
        // Defense-in-depth: a removed winner lane normally voids the race and
        // clears winnerId first; guard the stale case so no phantom name shows.
        if (liveEl.textContent !== '') liveEl.textContent = '';
      } else {
        const msg = t(s.language, 'winnerBanner', { name: s.camels[idx].name });
        if (liveEl.textContent !== msg) liveEl.textContent = msg;
      }
    } else if (!s.raceOver && liveEl.textContent !== '') {
      liveEl.textContent = '';
    }
  }

  laneContainer.addEventListener('click', function (ev) {
    const btn = ev.target.closest('[data-action]');
    if (!btn) return;
    const laneEl = btn.closest('.lane');
    const idx = Number(laneEl.dataset.index);
    const camel = core.getState().camels[idx];
    if (!camel) return;
    const action = btn.dataset.action;
    if (action === 'add') {
      if (core.addScore(camel.id, Number(btn.dataset.n))) hideValidation();
    } else if (action === 'set') {
      const raw = laneEl.querySelector('[data-exact]').value.trim();

  laneContainer.addEventListener('focusout', function (ev) {

  const CONFETTI_COUNT = 60;
  const CONFETTI_SEED = 99;
  const CONFETTI_COLORS = ['#e84a3a', '#3a6ae8', '#3aa84a', '#e8c83a', '#9a4ae8', '#e88a3a', '#3ad8d8', '#e85a9a', '#f0f0f0'];

  // Every legend char resolves through the sprite's own palette (falling back to
  // the fixed COL tones), so the old H=hoof / K=checker clashes are gone:
  // camel H = highlight, K = skin; the finish flag uses X = checker-dark.
  const CHAR_KEY = {
    O: 'outline', B: 'body', S: 'shade', H: 'highlight', R: 'robe',
    W: 'white', K: 'skin', L: 'blanket', E: 'eye',
    G: 'grass', P: 'pole', C: 'checkerLight', X: 'checkerDark', F: 'flag',
  };

  function drawSprite(rows, x, y, palette) {
    const ox = Math.round(x);
    const oy = Math.round(y);
    for (let ry = 0; ry < rows.length; ry++) {
      const row = rows[ry];
      for (let rx = 0; rx < row.length; rx++) {
        const key = CHAR_KEY[row[rx]];
        if (!key) continue;
        const color = (palette && palette[key]) || COL[key];
        if (!color) continue;
        ctx.fillStyle = color;
        ctx.fillRect(ox + rx, oy + ry, 1, 1);
      }
    }
  }

  // Draw the camel's 1-based lane digit on its saddle blanket (3x5, anchored at
  // sprite-local (9,10)) in the dark blanket-number ink, after the sprite pass.
  function drawBlanketNumber(left, top, laneIndex) {
    let n = laneIndex + 1;
    if (n > 9) n = 0; // unreachable safety fallback: lane count is capped at 8
    const glyph = DIGIT_FONT[String(n)];
    if (!glyph) return;
    ctx.fillStyle = BLANKET_DIGIT_COLOR;
    for (let ry = 0; ry < 5; ry++) {
      const row = glyph[ry];
      for (let rx = 0; rx < 3; rx++) {
        if (row[rx] === '#') ctx.fillRect(Math.round(left) + 9 + rx, Math.round(top) + 10 + ry, 1, 1);
      }
    }
  }

  function hash2(a, b) {
    let h = (a * 374761393 + b * 668265263) | 0;
    h = (h ^ (h >>> 13)) | 0;
    h = Math.imul(h, 1274126177);
    return (h ^ (h >>> 16)) >>> 0;
  }

  function mulberry32(seed) {
    let a = seed | 0;
    return function () {
      a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function drawSky() {
    const bandH = Math.ceil(HORIZON_Y / SKY_BANDS.length);
    for (let i = 0; i < SKY_BANDS.length; i++) {
      ctx.fillStyle = SKY_BANDS[i];
      ctx.fillRect(0, i * bandH, CANVAS_W, bandH);
    }
  }

  function drawSun() {
    const cx = 408, cy = 30, r = 13;
    for (let dy = -r; dy <= r; dy++) {
      const span = Math.floor(Math.sqrt(r * r - dy * dy));
      ctx.fillStyle = (Math.abs(dy) > r - 3) ? '#f0c060' : '#e8a03a';
      ctx.fillRect(cx - span, cy + dy, span * 2 + 1, 1);
    }
  }

  function drawDuneBand(baseY, offset, color) {
    ctx.fillStyle = color;
    for (let x = 0; x < CANVAS_W; x++) {
      const tt = (x + offset) * 0.05;
      const h = 6 + Math.round(Math.sin(tt) * 4 + Math.sin(tt * 0.5) * 2);
      const top = baseY - h;
      ctx.fillRect(x, top, 1, HORIZON_Y - top + 2);
    }
  }

  function drawDunes(win) {
    drawDuneBand(HORIZON_Y - 18, (win.min * 0.3) % 120, '#3a2a4a');
    drawDuneBand(HORIZON_Y - 6, (win.min * 0.6) % 90, '#4a3550');
  }

  function drawDecor(win) {
    // Zoomed out past DECOR_MAX_SPAN the window spans too many decoration cells
    // to draw cheaply; skip world decor (sky/dunes stay, they are cheap bands).
    if ((win.max - win.min) > DECOR_MAX_SPAN) { runtime.decorDrawn = 0; return; }
    // Cull in world space: mapX clamps to [0,CANVAS_W], so an on-screen cull would
    // leave off-window decorations piled at the edges. Margin keeps sprites that
    // straddle the window edge.
    const margin = (win.max - win.min) * (16 / CANVAS_W);
    const startK = Math.floor((win.min - DECOR_SPACING) / DECOR_SPACING);
    const endK = Math.ceil((win.max + DECOR_SPACING) / DECOR_SPACING);
    let drawn = 0;
    for (let k = startK; k <= endK; k++) {
      const rng = mulberry32(hash2(SEED, k));
      const roll = rng();
      const point = k * DECOR_SPACING + Math.floor(rng() * 40 - 20);
      if (point < win.min - margin || point > win.max + margin) continue;
      const cx = mapX(point, win);
      if (roll < 0.34) { drawSprite(PALM, cx - PALM[0].length / 2, HORIZON_Y - 20, PALM_PAL); drawn++; }
      else if (roll < 0.67) { drawSprite(CACTUS, cx - CACTUS[0].length / 2, HORIZON_Y - 16, CACTUS_PAL); drawn++; }
      else { drawSprite(ROCK, cx - ROCK[0].length / 2, HORIZON_Y - 8, ROCK_PAL); drawn++; }
    }
    runtime.decorDrawn = drawn;
  }

  function drawMilestones(win) {
    // Milestones are world decor: past DECOR_MAX_SPAN the window spans too many
    // 50-point cells to iterate cheaply (scores are unbounded), so drop them like
    // drawDecor does. Below the bound this is <= 30 iterations per frame.
    if ((win.max - win.min) > DECOR_MAX_SPAN) return;
    ctx.font = '6px monospace';
    ctx.textBaseline = 'top';
    const start = Math.max(MILESTONE_STEP, Math.ceil(win.min / MILESTONE_STEP) * MILESTONE_STEP);
    for (let m = start; m <= win.max; m += MILESTONE_STEP) {
      const x = mapX(m, win) - 2;
      if (x < -12 || x > CANVAS_W + 12) continue;
      // Stand the flag on the terrain at its world position.
      const flagY = HORIZON_Y - 14 - Math.round(core.terrainHeightAt(m));
      drawSprite(MILESTONE, x, flagY, { body: '#6b4a2a', shade: '#4a3320', grass: '#6b4a2a' });
      // At high-but-allowed zoom a 50-point step can be narrower than the label,
      // so skip the number (flag still drawn) to avoid colliding labels.
      const label = String(m);
      const stepPx = mapX(m + MILESTONE_STEP, win) - mapX(m, win);
      if (stepPx < ctx.measureText(label).width + 4) continue;
      ctx.fillStyle = '#e8e0d0';
      ctx.fillText(label, x + 10, flagY + 3);
    }
  }

  function drawFinish(s, win) {
    if (!runtime.finishVisible || runtime.goalScreenX == null) return;
    // mapX clamps to [0,CANVAS_W], so a goal outside the window would otherwise
    // pin the flag clipped to the edge. Draw nothing until it scrolls into view.
    if (s.goalScore < win.min || s.goalScore > win.max) return;
    // Stand the pole on the terrain at the goal's world position.
    const poleTop = HORIZON_Y - Math.round(core.terrainHeightAt(s.goalScore));
    const x = Math.round(runtime.goalScreenX) - 6;
    drawSprite(FINISH_FLAG, x, poleTop - 14, COL);
    const stripeX = x + 4;
    // Checker parity is relative to the pole top so the stripe alternates
    // light/dark from its first row (matching the flag's checkered look).
    for (let y = poleTop; y < LANE_BOTTOM; y += 4) {
      ctx.fillStyle = (Math.floor((y - poleTop) / 4) % 2 === 0) ? COL.checkerLight : COL.checkerDark;
      ctx.fillRect(stripeX, y, 4, 4);
    }
  }

  function spawnConfetti(cx, cy) {
    for (let i = 0; i < CONFETTI_COUNT; i++) {
      const rng = mulberry32(hash2(CONFETTI_SEED, i));
      runtime.confetti.push({
        x: cx,
        y: cy,
        vx: (rng() * 2 - 1) * 60,
        vy: -(rng() * 60 + 30),
        color: CONFETTI_COLORS[i % CONFETTI_COLORS.length],
        age: 0,
        life: 900 + rng() * 300,
      });
    }
  }

  function updateConfetti(dt) {
    const alive = [];
    for (const p of runtime.confetti) {
      p.age += dt;
      p.vy += 140 * dt / 1000;
      p.x += p.vx * dt / 1000;
      p.y += p.vy * dt / 1000;
      if (p.age < p.life && p.y < CANVAS_H + 4 && p.x > -4 && p.x < CANVAS_W + 4) alive.push(p);
    }
    runtime.confetti = alive;
  }

  function drawConfetti() {
    runtime.confettiDrawn = runtime.confetti.length;
    for (const p of runtime.confetti) {
      ctx.fillStyle = p.color;
      ctx.fillRect(Math.round(p.x), Math.round(p.y), 2, 2);
    }
  }

  function drawBanner(s) {
    if (!s.raceOver || !s.winnerId) return;
    const idx = s.camels.findIndex(function (c) { return c.id === s.winnerId; });
    if (idx < 0) return; // Defense-in-depth: winner lane gone; draw nothing
    const text = t(s.language, 'winnerBanner', { name: s.camels[idx].name });
    ctx.font = '8px monospace';
    ctx.textBaseline = 'top';
    const w = Math.ceil(ctx.measureText(text).width) + 16;
    const x = Math.round((CANVAS_W - w) / 2);
    const y = 8;
    ctx.fillStyle = '#000000';
    ctx.fillRect(x - 2, y - 2, w + 4, 16);
    ctx.fillStyle = COL.flag;
    ctx.fillRect(x, y, w, 12);
    ctx.fillStyle = '#1a1208';
    ctx.fillText(text, x + 8, y + 2);
  }

  // Terrain height per canvas column, independent of lane: precompute once per
  // frame so 8 lanes do not each re-evaluate ~512 sin pairs (pixel-identical).
  function terrainHeights(win) {
    const span = Math.max(1e-6, win.max - win.min);
    const heights = new Array(CANVAS_W);
    for (let x = 0; x < CANVAS_W; x++) {
      const worldX = win.min + ((x + 0.5) / CANVAS_W) * span;
      heights[x] = Math.round(core.terrainHeightAt(worldX));
    }
    return heights;
  }

  function drawLanes(s, win) {
    const n = s.camels.length;
    const heights = terrainHeights(win);
    for (let i = 0; i < n; i++) {
      const top = Math.round(laneTopY(i, n));
      const bottom = Math.round(laneBottomY(i, n));
      // Base sand fills the whole lane so there are never gaps between lanes.
      ctx.fillStyle = DUNE.top;
      ctx.fillRect(0, top, CANVAS_W, bottom - top);
      ctx.fillStyle = DUNE.edge;
      ctx.fillRect(0, bottom - 1, CANVAS_W, 1);
      for (let x = 0; x < CANVAS_W; x++) {
        const h = heights[x];
        // Undulating crest: rises above the lane top when h > 0 (lower lanes
        // drawn later overlap it), never poking above the horizon sky.
        let crest = Math.max(HORIZON_Y, top - h);
        if (crest > bottom - 2) crest = bottom - 2;
        ctx.fillStyle = DUNE.rim;
        ctx.fillRect(x, crest, 1, 1);
        ctx.fillStyle = DUNE.shade;
        ctx.fillRect(x, crest + 3, 1, 2);
      }
    }
    // Paint the rows below the last lane so no transparent strip remains.
    ctx.fillStyle = DUNE.edge;
    ctx.fillRect(0, LANE_BOTTOM, CANVAS_W, CANVAS_H - LANE_BOTTOM);
  }

  function drawCamels(s, win, now) {
    const n = s.camels.length;
    s.camels.forEach(function (c, i) {
      const v = runtime.visualLeft[c.id];
      const left = (v == null) ? camelTargetLeft(c.score, win) : v;
      const frameIndex = (now < c.animUntil) ? (Math.floor(now / ANIM_FRAME_MS) % 4) + 1 : 0;
      const top = camelTopY(i, n, c.score);
      drawSprite(CAMEL[frameIndex], left, top, CAMEL_PAL(c.color));
      drawBlanketNumber(left, top, i);
    });
  }

  function updateRuntime(s, dt, now) {
    const win = runtime.frameWindow;
    for (const c of s.camels) {
      const target = camelTargetLeft(c.score, win);
      const v = runtime.visualLeft[c.id];
      const m = runtime.motion[c.id];
      if (v == null || m == null) {
        runtime.visualLeft[c.id] = target;
        runtime.motion[c.id] = { from: target, target: target, start: now };
        continue;
      }
      if (Math.abs(m.target - target) > 0.01) {
        // Retarget mid-flight: ease from where the sprite is right now.
        m.from = v;
        m.target = target;
        m.start = now;
      }
      const p = Math.min(1, (now - m.start) / LERP_MS);
      const eased = 1 - Math.pow(1 - p, 3);
      runtime.visualLeft[c.id] = (p >= 1) ? m.target : m.from + (m.target - m.from) * eased;
    }
    const ids = new Set(s.camels.map(function (c) { return c.id; }));
    for (const id of Object.keys(runtime.visualLeft)) {
      if (!ids.has(id)) { delete runtime.visualLeft[id]; delete runtime.motion[id]; }
    }

    const winnerIdx = (s.raceOver && s.winnerId)
      ? s.camels.findIndex(function (c) { return c.id === s.winnerId; })
      : -1;
    if (s.raceOver && s.winnerId && winnerIdx < 0) {
      // Defense-in-depth: winner camel removed (e.g. a camel-count shrink); drop
      // any burst and
      // stop tracking so nothing dereferences a lane that no longer exists.
      runtime.lastWinnerId = null;
      runtime.confetti = [];
    } else if (s.raceOver && s.winnerId && runtime.lastWinnerId !== s.winnerId) {
      runtime.lastWinnerId = s.winnerId;
      const c = s.camels[winnerIdx];
      const cx = (runtime.visualLeft[c.id] == null ? camelTargetLeft(c.score, win) : runtime.visualLeft[c.id]) + SPRITE_W / 2;
      spawnConfetti(cx, laneSurfaceY(winnerIdx, s.camels.length, c.score) - 4);
    }
    if (!s.raceOver && runtime.lastWinnerId !== null) {
      runtime.lastWinnerId = null;
      runtime.confetti = [];
    }

    updateConfetti(dt);

    runtime.finishVisible = !s.infinite && s.goalScore != null;
    runtime.goalScreenX = runtime.finishVisible ? mapX(s.goalScore, win) : null;
  }

  function drawScene(s, win, now) {
    drawSky();
    drawSun();
    drawDunes(win);
    drawDecor(win);
    drawMilestones(win);
    drawLanes(s, win);
    drawFinish(s, win);
    drawCamels(s, win, now);
    drawConfetti();
    drawBanner(s);
  }

  let last = performance.now();
  let frameErrorLogged = false; // rate-limit: one log per error occurrence
  function frame(now) {
    try {
      const dt = Math.min(50, now - last);
      last = now;
      const s = core.getState();
      const win = currentWindow(s);
      runtime.frameWindow = win;
      updateRuntime(s, dt, now);
      drawScene(s, win, now);
      frameErrorLogged = false; // a clean frame re-arms logging
    } catch (err) {
      // A single bad frame must not kill the loop; the next frame re-schedules.
      // Log once per occurrence so a persistent render error is not 60x/s spam.
      if (!frameErrorLogged) {
        frameErrorLogged = true;
        console.error(err);
      }
    } finally {
      window.requestAnimationFrame(frame);
    }
  }

  window.GameDebug = {
    getState: function () { return core.getState(); },
    getCameraWindow: function () {
      const w = runtime.frameWindow || currentWindow(core.getState());
      return { min: w.min, max: w.max };
    },
    getCanvasSize: function () { return { width: CANVAS_W, height: CANVAS_H }; },
    getCanvasLayout: function () {
      return {
        scale: canvasScale,
        bufferWidth: CANVAS_W,
        bufferHeight: CANVAS_H,
        cssWidth: parseFloat(canvas.style.width) || CANVAS_W,
        cssHeight: parseFloat(canvas.style.height) || CANVAS_H,
        wrapperWidth: canvasWrap.clientWidth,
        wrapperHeight: canvasWrap.clientHeight,
      };
    },
    getCamelSpriteBounds: function () {
      const s = core.getState();
      const win = runtime.frameWindow || currentWindow(s);
      const n = s.camels.length;
      return s.camels.map(function (c, i) {
        const v = runtime.visualLeft[c.id];
        const left = (v == null) ? camelTargetLeft(c.score, win) : v;
        const top = camelTopY(i, n, c.score);
        return { id: c.id, lane: i, left: left, right: left + SPRITE_W, top: top, bottom: top + SPRITE_H };
      });
    },
    isSettled: function () {
      const s = core.getState();
      const win = runtime.frameWindow || currentWindow(s);
      return s.camels.every(function (c) {
        const v = runtime.visualLeft[c.id];
        if (v == null) return true;
        return Math.abs(v - camelTargetLeft(c.score, win)) <= 0.5;
      });
    },
    getScene: function () {
      return { finishVisible: runtime.finishVisible, goalScreenX: runtime.goalScreenX, decorDrawn: runtime.decorDrawn, confettiDrawn: runtime.confettiDrawn };
    },
  };

  window.requestAnimationFrame(frame);

  // Fit the canvas once now, and again on viewport/wrapper changes (rAF-debounced).
  applyCanvasLayout();
  window.addEventListener('resize', requestLayout);
  if (typeof ResizeObserver !== 'undefined') {
    const ro = new ResizeObserver(requestLayout);
    ro.observe(canvasWrap);
  }
})();
</script>
</body>
</html>
