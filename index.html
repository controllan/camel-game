<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BOAR RACE</title>
<style>
  :root {
    --bg:#120b1e; --panel:#1c1430; --panel2:#241b3a; --ink:#e8e0f0;
    --accent:#e8c83a; --border:#4a3550; --btn:#2b2140; --btn-hover:#3a2d55;
    --focus:#3ad8d8; --danger:#e84a3a;
  }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; height:100%; overflow:hidden;
    background:var(--bg); color:var(--ink);
    font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size:14px; }
  /* Full-viewport shell: the page itself never scrolls; only the panel may. */
  .app {
    height:100vh;                 /* fallback for browsers without dvh */
    height:100dvh;
    padding:12px;
    display:flex; flex-direction:column; overflow:hidden;
  }
  header { flex:0 0 auto; display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:10px; }
  h1 { font-size:18px; letter-spacing:2px; margin:0; color:var(--accent); }
  main { flex:1 1 auto; min-height:0; display:flex; gap:12px; align-items:stretch; }
  #canvasWrap { flex:1 1 auto; min-width:0; min-height:0; overflow:hidden;
    display:flex; align-items:center; justify-content:center; }
  canvas#game { display:block; box-sizing:content-box; image-rendering:pixelated; background:#000; border:2px solid var(--border); }
  #panel { flex:0 0 320px; width:320px; min-width:260px; height:100%; min-height:0;
    overflow-y:auto; background:var(--panel); border:2px solid var(--border); padding:10px; }
  .row { display:flex; align-items:center; gap:8px; margin-bottom:8px; flex-wrap:wrap; }
  label { font-size:13px; }
  input[type=number] { width:80px; background:var(--panel2); color:var(--ink);
    border:2px solid var(--border); padding:4px 6px; font:inherit; }
  input:disabled { opacity:.45; }
  button { background:var(--btn); color:var(--ink); border:2px solid var(--border);
    padding:4px 8px; font:inherit; cursor:pointer; border-radius:0; }
  button:hover:not(:disabled) { background:var(--btn-hover); }
  button:disabled { opacity:.45; cursor:not-allowed; }
  button[aria-pressed="true"] { background:var(--accent); color:#1a1208; }
  .toggles { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .lang button { min-width:44px; }
  .themes button { min-width:64px; }
  :focus-visible { outline:2px solid var(--focus); outline-offset:1px; }
  .lane { border-top:2px solid var(--border); padding-top:8px; margin-top:8px; }
  .lane:first-child { border-top:0; padding-top:0; margin-top:0; }
  .lane .cname { display:inline-block; min-width:84px; font-weight:bold; }
  .lane .btns { display:inline-flex; gap:4px; margin:4px 0; }
  #validation { color:var(--danger); margin:6px 0 0; font-size:13px; }
  #live { position:absolute; width:1px; height:1px; margin:-1px; padding:0; border:0;
    overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
  /* Stack strictly below 900px so the panel sits beside the canvas at exactly 900px. */
  @media (max-width: 899.98px) {
    main { flex-direction: column; }
    #canvasWrap { flex:1 1 0; }
    #panel { flex:0 1 auto; width:100%; min-width:0; height:auto; max-height:45dvh; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1 id="title">BOAR RACE</h1>
    <div class="toggles">
      <div class="lang" role="group" aria-label="Language" id="languageToggle">
        <button id="lang-en" type="button" aria-pressed="true">EN</button>
        <button id="lang-de" type="button" aria-pressed="false">DE</button>
      </div>
      <div class="lang themes" role="group" aria-label="Theme" id="themeToggle">
        <button id="theme-desert" type="button" aria-pressed="false">Desert</button>
        <button id="theme-forest" type="button" aria-pressed="true">Forest</button>
      </div>
    </div>
  </header>
  <main>
    <div id="canvasWrap">
      <canvas id="game" width="1280" height="720"
        aria-label="Wild boar race track. Racers move left to right to the goal."></canvas>
    </div>
    <aside id="panel" aria-label="Controls">
      <div class="row">
        <label for="camelCount" id="camelCountLabel">Wild boars</label>
        <input id="camelCount" type="number" min="2" max="8" step="1" value="4">
      </div>
      <div class="row">
        <label for="goalScore" id="goalLabel">Goal</label>
        <input id="goalScore" type="number" min="1" max="10000" step="1" value="200">
        <label for="infinite"><input id="infinite" type="checkbox"> <span id="infiniteText">∞</span></label>
      </div>
      <div id="laneControls"></div>
      <div class="row" style="margin-top:8px">
        <button id="newRace" type="button">New race</button>
      </div>
      <p id="validation" role="alert" hidden>Enter a whole number ≥ 0.</p>
    </aside>
  </main>
  <div id="live" aria-live="polite" role="status"></div>
</div>
<script id="core">
window.GameCore = (function () {
  'use strict';
  const PALETTE = ['#e84a3a', '#3a6ae8', '#3aa84a', '#e8c83a', '#9a4ae8', '#e88a3a', '#3ad8d8', '#e85a9a'];
  const MIN_CAMELS = 2, MAX_CAMELS = 8;
  // Custom lane names are session-only and never translated; defaults are the
  // same template in both languages so they read identically.
  const NAME_TEMPLATES = { en: 'Team {n}', de: 'Team {n}' };
  const NAME_MAX = 16;
  const GOAL_MIN = 1, GOAL_MAX = 10000;
  const PAD = 20, MIN_WINDOW = 100, GOAL_SLACK = 80;
  // Shared dune height field h(x): deterministic, no Math.random, amplitude
  // A1+A2 = 2 px, wavelengths 160/130 px. Same profile for every lane.
  const TERRAIN = { A1: 1.2, L1: 160, PH1: 0, A2: 0.8, L2: 130, PH2: 1.7 };
  function terrainHeightAt(x) {
    const px = (typeof x === 'number' && Number.isFinite(x)) ? x : 0;
    const h = TERRAIN.A1 * Math.sin(2 * Math.PI * px / TERRAIN.L1 + TERRAIN.PH1)
      + TERRAIN.A2 * Math.sin(2 * Math.PI * px / TERRAIN.L2 + TERRAIN.PH2);
    return Math.max(-2, Math.min(2, h));
  }
  // Walk animation keeps running this long after the last score change so a
  // full 4-frame cycle (4 x 320ms = 1280ms) always completes.
  const ANIM_MS = 1400;

  let clock = (typeof performance !== 'undefined' && performance.now)
    ? function () { return performance.now(); }
    : function () { return Date.now(); };

  const state = {
    camels: [],
    camelCount: 4,
    goalScore: 200,
    infinite: false,
    language: 'en',
    theme: 'forest',
    raceOver: false,
    winnerId: null,
  };

  const listeners = new Set();
  function subscribe(fn) { listeners.add(fn); return function () { listeners.delete(fn); }; }
  function emit() { for (const fn of listeners) fn(getState()); }

  function camelName(index, language) {
    const template = NAME_TEMPLATES[language] || NAME_TEMPLATES.en;
    return template.replace('{n}', String(index + 1));
  }

  function makeCamel(index, score) {
    return {
      id: 'camel-' + index,
      name: camelName(index, state.language),
      color: PALETTE[index % PALETTE.length],
      score: score,
      lane: index,
      animUntil: 0,
    };
  }

  function isValidScore(n) {
    return typeof n === 'number' && Number.isInteger(n) && n >= 0;
  }

  function findCamel(id) {
    for (const c of state.camels) if (c.id === id) return c;
    return null;
  }

  function rebuildCamels(count) {
    const next = [];
    for (let i = 0; i < count; i++) {
      const existing = state.camels[i];
      if (existing) {
        next.push({
          id: existing.id,
          name: existing.name,
          color: PALETTE[i % PALETTE.length],
          score: existing.score,
          lane: i,
          animUntil: existing.animUntil,
        });
      } else {
        next.push(makeCamel(i, 0));
      }
    }
    state.camels = next;
    state.camelCount = count;
  }

  function checkWinner() {
    if (state.raceOver || state.infinite || state.goalScore == null) return;
    for (const c of state.camels) {
      if (c.score >= state.goalScore) {
        state.raceOver = true;
        state.winnerId = c.id;
        return;
      }
    }
  }

  function addScore(camelId, n) {
    if (state.raceOver) return false;
    const c = findCamel(camelId);
    if (!c) return false;
    if (typeof n !== 'number' || !Number.isInteger(n) || n <= 0) return false;
    c.score += n;
    c.animUntil = clock() + ANIM_MS;
    checkWinner();
    emit();
    return true;
  }

  function setScore(camelId, n) {
    if (state.raceOver) return false;
    const c = findCamel(camelId);
    if (!c) return false;
    if (!isValidScore(n)) return false;
    c.score = n;
    c.animUntil = clock() + ANIM_MS;
    checkWinner();
    emit();
    return true;
  }

  function setCamelCount(n) {
    if (!Number.isInteger(n)) return false;
    const count = Math.max(MIN_CAMELS, Math.min(MAX_CAMELS, n));
    rebuildCamels(count);
    // If a shrink drops the winning camel, the race is void: no winner exists
    // in the remaining lanes, so unlock (scores and config otherwise untouched).
    if (state.raceOver && state.winnerId && !findCamel(state.winnerId)) {
      state.raceOver = false;
      state.winnerId = null;
      // A remaining camel may already be at/above a just-lowered goal.
      checkWinner();
    }
    emit();
    return true;
  }

  function setGoal(scoreOrNull) {
    if (scoreOrNull === null) {
      state.infinite = true;
      state.goalScore = null;
    } else {
      if (!Number.isInteger(scoreOrNull) || scoreOrNull < GOAL_MIN || scoreOrNull > GOAL_MAX) return false;
      state.infinite = false;
      state.goalScore = scoreOrNull;
      checkWinner();
    }
    emit();
    return true;
  }

  function resetRace() {
    for (const c of state.camels) { c.score = 0; c.animUntil = 0; }
    state.raceOver = false;
    state.winnerId = null;
    emit();
    return true;
  }

  function setLanguage(lang) {
    if (lang !== 'en' && lang !== 'de') return false;
    state.language = lang;
    // Lane names are session-only and never translated (custom names preserved).
    emit();
    return true;
  }

  // Rename a lane. Trims surrounding whitespace; rejects empty or >16-char
  // input without touching state. Names are session-only.
  function setCamelName(camelId, name) {
    const c = findCamel(camelId);
    if (!c) return false;
    if (typeof name !== 'string') return false;
    const trimmedRaw = name.trim();
    // Strip control chars, bidi overrides/isolates and zero-width chars
    // (C0/C1 controls + Cf format chars) so names cannot spoof local display.
    const trimmed = trimmedRaw.replace(/[\p{Cc}\p{Cf}]/gu, '');
    if (trimmed.length === 0 || trimmed.length > NAME_MAX) return false;
    c.name = trimmed;
    emit();
    return true;
  }

  function setClock(fn) { clock = fn; }

  function getState() {
    return {
      camels: state.camels.map(function (c) {
        return { id: c.id, name: c.name, color: c.color, score: c.score, lane: c.lane, animUntil: c.animUntil };
      }),
      camelCount: state.camelCount,
      goalScore: state.goalScore,
      infinite: state.infinite,
      language: state.language,
      theme: state.theme,
      raceOver: state.raceOver,
      winnerId: state.winnerId,
    };
  }

  function computeCameraWindow(scores, goalScore) {
    if (!Array.isArray(scores) || scores.length === 0) return { min: 0, max: MIN_WINDOW };
    let minScore = Infinity, maxScore = -Infinity;
    for (const s of scores) {
      const v = (typeof s === 'number' && Number.isFinite(s)) ? s : 0;
      if (v < minScore) minScore = v;
      if (v > maxScore) maxScore = v;
    }
    const span = maxScore - minScore;
    const wMin = minScore - PAD;
    let wMax = Math.max(maxScore + PAD, wMin + MIN_WINDOW);
    if (goalScore != null && Number.isFinite(goalScore) && (goalScore - wMin) <= (span + GOAL_SLACK)) {
      wMax = Math.max(wMax, goalScore + PAD);
    }
    return { min: wMin, max: wMax };
  }

  function mapScoreToScreenX(score, window, canvasWidth) {
    const w = window || { min: 0, max: MIN_WINDOW };
    const width = (typeof canvasWidth === 'number' && canvasWidth > 0) ? canvasWidth : 1280;
    const span = w.max - w.min;
    if (span <= 0) return 0;
    const x = ((score - w.min) / span) * width;
    return Math.max(0, Math.min(width, x));
  }

  // ---------- persistence ----------
  const KEY = 'camelRace.v1';
  const VERSION = 1;
  // Theme ids known to the core for validation; #app registers the live registry.
  // Empty until #app calls registerThemeIds() at boot: the registry is the
  // single source of truth, so a missing registration must not be masked here.
  let themeIds = new Set();
  function registerThemeIds(ids) { themeIds = new Set(ids); }
  function getThemeIds() { return Array.from(themeIds); }
  function setTheme(id) {
    if (typeof id !== 'string' || !themeIds.has(id)) return false;
    state.theme = id;
    emit();
    return true;
  }

  function storageAvailable() {
    try {
      const k = '__camel_probe__';
      window.localStorage.setItem(k, '1');
      window.localStorage.removeItem(k);
      return true;
    } catch (e) { return false; }
  }

  function sanitizeStoredName(v, index) {
    if (typeof v !== 'string') return camelName(index, 'en');
    const cleaned = v.replace(/[\p{Cc}\p{Cf}]/gu, '').trim();
    const truncated = Array.from(cleaned).slice(0, NAME_MAX).join('');
    return truncated.length === 0 ? camelName(index, 'en') : truncated;
  }

  function defaultFields() {
    const camels = [];
    for (let i = 0; i < 4; i++) camels.push({ name: camelName(i, 'en'), score: 0 });
    return { camelCount: 4, camels: camels, goalScore: 200, infinite: false, language: 'en', theme: 'forest', raceOver: false, winnerId: null };
  }

  // Per-field validation; never throws, never propagates NaN. Returns the
  // validated fields plus whether the stored blob should be rewritten.
  function deserialize(raw) {
    const def = defaultFields();
    if (raw === null || typeof raw !== 'object' || Array.isArray(raw)) return { fields: def, writeBack: true };
    if (raw.version !== VERSION) return { fields: def, writeBack: false };

    let camelCount = def.camelCount;
    if (Number.isInteger(raw.camelCount)) camelCount = Math.max(MIN_CAMELS, Math.min(MAX_CAMELS, raw.camelCount));

    const src = Array.isArray(raw.camels) ? raw.camels : [];
    const camels = [];
    for (let i = 0; i < camelCount; i++) {
      const c = (src[i] && typeof src[i] === 'object' && !Array.isArray(src[i])) ? src[i] : {};
      let score = 0;
      if (Number.isInteger(c.score) && c.score >= 0 && c.score <= Number.MAX_SAFE_INTEGER) score = c.score;
      camels.push({ name: sanitizeStoredName(c.name, i), score: score });
    }

    let infinite = (typeof raw.infinite === 'boolean') ? raw.infinite : false;
    let goalScore;
    if (infinite) goalScore = null;
    else if (Number.isInteger(raw.goalScore)) goalScore = Math.max(GOAL_MIN, Math.min(GOAL_MAX, raw.goalScore));
    else goalScore = 200;

    const language = (raw.language === 'en' || raw.language === 'de') ? raw.language : 'en';
    const theme = (typeof raw.theme === 'string' && themeIds.has(raw.theme)) ? raw.theme : 'forest';
    const raceOver = (typeof raw.raceOver === 'boolean') ? raw.raceOver : false;

    let winnerId = null;
    if (raceOver && typeof raw.winnerId === 'string') {
      for (let i = 0; i < camelCount; i++) {
        if (raw.winnerId === 'camel-' + i) { winnerId = raw.winnerId; break; }
      }
    }

    return { fields: { camelCount: camelCount, camels: camels, goalScore: goalScore, infinite: infinite, language: language, theme: theme, raceOver: raceOver, winnerId: winnerId }, writeBack: false };
  }

  function applyFields(f) {
    state.language = f.language;
    state.theme = f.theme;
    state.infinite = f.infinite;
    state.goalScore = f.goalScore;
    state.raceOver = f.raceOver;
    state.winnerId = f.winnerId;
    const camels = [];
    for (let i = 0; i < f.camelCount; i++) {
      camels.push({
        id: 'camel-' + i,
        name: f.camels[i].name,
        color: PALETTE[i % PALETTE.length],
        score: f.camels[i].score,
        lane: i,
        animUntil: 0,
      });
    }
    state.camels = camels;
    state.camelCount = f.camelCount;
  }

  function serialize() {
    return {
      version: VERSION,
      camelCount: state.camelCount,
      camels: state.camels.map(function (c) { return { name: c.name, score: c.score }; }),
      goalScore: state.infinite ? null : state.goalScore,
      infinite: state.infinite,
      language: state.language,
      theme: state.theme,
      raceOver: state.raceOver,
      winnerId: state.winnerId,
    };
  }

  function load() {
    if (!storageAvailable()) return { restored: false };
    let text = null;
    try { text = window.localStorage.getItem(KEY); } catch (e) { return { restored: false }; }
    if (text == null) return { restored: false };
    let parsed = null, corrupt = false;
    try { parsed = JSON.parse(text); } catch (e) { corrupt = true; }
    const res = deserialize(corrupt ? null : parsed);
    applyFields(res.fields);
    if (res.writeBack) { try { window.localStorage.setItem(KEY, JSON.stringify(serialize())); } catch (e) { /* ignore */ } }
    emit();
    return { restored: true };
  }

  function save() {
    if (!storageAvailable()) return false;
    try { window.localStorage.setItem(KEY, JSON.stringify(serialize())); return true; } catch (e) { return false; }
  }

  function clear() {
    try { window.localStorage.removeItem(KEY); } catch (e) { /* ignore */ }
  }

  window.GameStorage = { KEY: KEY, VERSION: VERSION, available: storageAvailable, load: load, save: save, clear: clear };

  rebuildCamels(state.camelCount);

  return {
    PALETTE: PALETTE,
    NAME_TEMPLATES: NAME_TEMPLATES,
    MIN_CAMELS: MIN_CAMELS, MAX_CAMELS: MAX_CAMELS,
    GOAL_MIN: GOAL_MIN, GOAL_MAX: GOAL_MAX,
    PAD: PAD, MIN_WINDOW: MIN_WINDOW, GOAL_SLACK: GOAL_SLACK, ANIM_MS: ANIM_MS,
    addScore: addScore, setScore: setScore, setCamelCount: setCamelCount,
    setGoal: setGoal, resetRace: resetRace, setLanguage: setLanguage,
    setCamelName: setCamelName, setClock: setClock, getState: getState,
    subscribe: subscribe, camelName: camelName,
    KEY: KEY, VERSION: VERSION,
    serialize: serialize, deserialize: deserialize, applyFields: applyFields,
    setTheme: setTheme, getThemeIds: getThemeIds, registerThemeIds: registerThemeIds,
    storageAvailable: storageAvailable,
    computeCameraWindow: computeCameraWindow,
    mapScoreToScreenX: mapScoreToScreenX, terrainHeightAt: terrainHeightAt,
  };
})();
</script>
<script id="app">
(function () {
  'use strict';
  const core = window.GameCore;

  const canvas = document.getElementById('game');
  const canvasWrap = document.getElementById('canvasWrap');
  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  const CANVAS_W = canvas.width;   // 1280
  const CANVAS_H = canvas.height;  // 720

  const HORIZON_Y = 120;
  const LANE_BOTTOM = CANVAS_H - 8; // 712
  // Feet rest this many px above the lane bottom at terrain height 0.
  const TERRAIN_FEET_OFFSET = 2;
  const LANE_MARGIN = 4;
  // Unhurried Volksfest glide: each retarget tweens LERP_MS ease-out (cubic)
  // from the sprite's current position, so mid-flight retargets blend smoothly
  // instead of snapping. No artificial input-blocking delay.
  const LERP_MS = 900;
  // 4 walk frames x 320ms = 1280ms gait cycle; idle frame 0 when not animating.
  const ANIM_FRAME_MS = 320;
  const CANVAS_BORDER = 4; // 2px border on each side of the canvas
  // Fill the binding dimension of the wrapper, clamped to a sane range, then
  // snap to a crisp integer multiple only when the fit is already within 8% of
  // it AND the integer still fits (keeps 1x/2x where it does).
  const SCALE_EPSILON = 0.05, SCALE_MAX = 2;
  const SNAP_TOLERANCE = 0.08;

  const runtime = {
    visualLeft: Object.create(null),
    motion: Object.create(null),
    lastWinnerId: null,
    confetti: [],
    frameWindow: null,
    finishVisible: false,
    goalScreenX: null,
    decorDrawn: 0,
    decorFlat: 0, // v2 §2.14 flat-marks drawn this frame (test counter)
    decorLayers: { background: 0, midground: 0, floor: 0 },
    decorKinds: [],
    confettiDrawn: 0,
    teamLabels: [],
  };

  // ---------- canvas layout (fill the area; page never scrolls) ----------
  let canvasScale = 1;
  let lastCssW = -1, lastCssH = -1;
  let layoutPending = false;

  function computeScale(availW, availH) {
    const fit = Math.min(availW / CANVAS_W, availH / CANVAS_H);
    if (!(fit > 0)) return 0;
    // Cap only the upper bound: a minimum above the computed fit would force the
    // canvas wider than its wrapper (clipped by overflow:hidden). A tiny epsilon
    // guard keeps the canvas from collapsing to zero size.
    const capped = Math.min(SCALE_MAX, fit);
    const nearest = Math.round(capped);
    const snapFits = nearest * CANVAS_W <= availW && nearest * CANVAS_H <= availH;
    if (snapFits && Math.abs(capped - nearest) <= SNAP_TOLERANCE * nearest) {
      return nearest;
    }
    return Math.max(SCALE_EPSILON, capped);
  }

  function applyCanvasLayout() {
    layoutPending = false;
    const availW = canvasWrap.clientWidth - CANVAS_BORDER;
    const availH = canvasWrap.clientHeight - CANVAS_BORDER;
    if (availW <= 0 || availH <= 0) return;
    const scale = computeScale(availW, availH);
    if (!(scale > 0)) return;
    canvasScale = scale;
    const w = Math.floor(CANVAS_W * scale);
    const h = Math.floor(CANVAS_H * scale);
    if (w === lastCssW && h === lastCssH) return;
    lastCssW = w;
    lastCssH = h;
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
  }

  function requestLayout() {
    if (layoutPending) return;
    layoutPending = true;
    window.requestAnimationFrame(applyCanvasLayout);
  }

  function laneHeight(n) { return (LANE_BOTTOM - HORIZON_Y) / n; }
  function laneTopY(i, n) { return HORIZON_Y + i * laneHeight(n); }
  function laneBottomY(i, n) { return laneTopY(i, n) + laneHeight(n); }
  // Undulating sand surface for lane i at world position `score`.
  function laneSurfaceY(i, n, score) {
    return laneBottomY(i, n) - TERRAIN_FEET_OFFSET - Math.round(core.terrainHeightAt(score));
  }
  // Sprite top so the feet land on the surface, clamped inside the lane (an
  // 8-lane track is 74 px tall, 12 px of slack for a 62 px sprite over the
  // ±2 px dune bob and 1 px walk bob).
  function camelTopY(i, n, score) {
    const min = Math.round(laneTopY(i, n));
    const max = Math.round(laneBottomY(i, n) - SPRITE_H);
    const top = Math.round(laneSurfaceY(i, n, score) - SPRITE_H);
    return Math.max(min, Math.min(max, top));
  }
  function mapX(point, win) { return core.mapScoreToScreenX(point, win, CANVAS_W); }
  function camelTargetLeft(score, win) {
    const cx = mapX(score, win);
    return Math.max(LANE_MARGIN, Math.min(CANVAS_W - SPRITE_W - LANE_MARGIN, cx - SPRITE_W / 2));
  }
  function currentWindow(s) {
    return core.computeCameraWindow(s.camels.map(function (c) { return c.score; }), s.goalScore);

  function buildLane(index) {
    const el = document.createElement('div');
    el.className = 'lane';
    el.dataset.index = String(index);

    const name = document.createElement('span');
    name.className = 'cname';
    name.setAttribute('data-name', '');

    const nameRow = document.createElement('div');
    nameRow.className = 'row';
    const nameLabel = document.createElement('label');
    nameLabel.setAttribute('data-name-label', '');
    nameLabel.setAttribute('for', 'name-' + index);
    const nameInput = document.createElement('input');
    nameInput.id = 'name-' + index;
    nameInput.type = 'text';
    nameInput.maxLength = 16;
    nameInput.setAttribute('data-name-input', '');
    nameRow.append(nameLabel, nameInput);

    const btns = document.createElement('div');
    btns.className = 'btns';
    for (const n of [1, 5, 10]) {
      const b = document.createElement('button');
      b.type = 'button';
      b.setAttribute('data-action', 'add');
      b.setAttribute('data-n', String(n));
      btns.appendChild(b);
    }

    const row = document.createElement('div');
    row.className = 'row';
    const label = document.createElement('label');
    label.setAttribute('data-score-label', '');
    label.setAttribute('for', 'exact-' + index);
    const input = document.createElement('input');
    input.id = 'exact-' + index;
    input.type = 'number';
    input.min = '0';
    input.step = '1';
    input.setAttribute('data-exact', '');
    input.value = '0';
    const set = document.createElement('button');
    set.type = 'button';
    set.setAttribute('data-action', 'set');
    row.append(label, input, set);

    el.append(name, nameRow, btns, row);
    return el;
  }

  function renderLanes(s) {
    if (renderedCount !== s.camels.length) {
      laneContainer.replaceChildren.apply(laneContainer, s.camels.map(function (c, i) { return buildLane(i); }));
      renderedCount = s.camels.length;
    }
    const lanes = laneContainer.querySelectorAll('.lane');
    s.camels.forEach(function (c, i) {
      const el = lanes[i];
      if (!el) return;
      const name = el.querySelector('[data-name]');
      name.textContent = c.name;
      name.style.color = c.color;
      el.querySelector('[data-name-label]').textContent = t(s.language, 'teamLabel');
      const nameInput = el.querySelector('[data-name-input]');
      // Never clobber the field while the user is typing in it.
      if (document.activeElement !== nameInput) nameInput.value = c.name;
      el.querySelector('[data-action="add"][data-n="1"]').textContent = t(s.language, 'plus1');
      el.querySelector('[data-action="add"][data-n="5"]').textContent = t(s.language, 'plus5');
      el.querySelector('[data-action="add"][data-n="10"]').textContent = t(s.language, 'plus10');
      el.querySelector('[data-score-label]').textContent = t(s.language, 'scoreLabel');
      el.querySelector('[data-action="set"]').textContent = t(s.language, 'setButton');
      el.querySelector('[data-exact]').value = String(c.score);
      const lock = s.raceOver;
      el.querySelectorAll('[data-action], [data-exact]').forEach(function (ctl) { ctl.disabled = lock; });
    });
  }

  function syncDom(s) {
    // Registry-driven: the theme entry names the i18n key for the game title.
    const themeDef = THEMES[s.theme] || THEMES.forest;
    const title = t(s.language, themeDef.titleKey);
    document.getElementById('title').textContent = title;
    document.title = title;
    document.getElementById('camelCountLabel').textContent = t(s.language, themeDef.countLabelKey);
    document.getElementById('goalLabel').textContent = t(s.language, 'goalLabel');
    document.getElementById('infiniteText').textContent = t(s.language, 'infiniteLabel');
    document.getElementById('newRace').textContent = t(s.language, 'newRace');
    document.getElementById('lang-en').setAttribute('aria-pressed', String(s.language === 'en'));
    document.getElementById('lang-de').setAttribute('aria-pressed', String(s.language === 'de'));
    document.getElementById('themeToggle').setAttribute('aria-label', t(s.language, 'themeLabel'));
    document.getElementById('theme-desert').textContent = t(s.language, 'themeDesert');
    document.getElementById('theme-forest').textContent = t(s.language, 'themeForest');
    document.getElementById('theme-desert').setAttribute('aria-pressed', String(s.theme === 'desert'));
    document.getElementById('theme-forest').setAttribute('aria-pressed', String(s.theme === 'forest'));
    canvas.setAttribute('aria-label', t(s.language, themeDef.canvasLabelKey));
    validationEl.textContent = t(s.language, 'validationHint');

    camelCountEl.value = String(s.camelCount);
    infiniteEl.checked = s.infinite;
    goalEl.disabled = s.infinite;
    if (!s.infinite && s.goalScore != null) goalEl.value = String(s.goalScore);

    renderLanes(s);
    if (s.raceOver && s.winnerId) {
      const idx = s.camels.findIndex(function (c) { return c.id === s.winnerId; });
      if (idx < 0) {
        // Defense-in-depth: a removed winner lane normally voids the race and
        // clears winnerId first; guard the stale case so no phantom name shows.
        if (liveEl.textContent !== '') liveEl.textContent = '';
      } else {
        const msg = t(s.language, 'winnerBanner', { name: s.camels[idx].name });
        if (liveEl.textContent !== msg) liveEl.textContent = msg;
      }
    } else if (!s.raceOver && liveEl.textContent !== '') {
      liveEl.textContent = '';
    }
  }

  laneContainer.addEventListener('click', function (ev) {
    const btn = ev.target.closest('[data-action]');
    if (!btn) return;
    const laneEl = btn.closest('.lane');
    const idx = Number(laneEl.dataset.index);
    const camel = core.getState().camels[idx];
    if (!camel) return;
    const action = btn.dataset.action;
    if (action === 'add') {
      if (core.addScore(camel.id, Number(btn.dataset.n))) hideValidation();
    } else if (action === 'set') {
      const raw = laneEl.querySelector('[data-exact]').value.trim();
      if (/^\d+$/.test(raw)) {
        if (core.setScore(camel.id, Number(raw))) hideValidation();
      } else {
        showValidation();
      }
    }
  });

  laneContainer.addEventListener('input', function (ev) {
    const input = ev.target.closest('[data-name-input]');
    if (!input) return;
    const laneEl = input.closest('.lane');
    const idx = Number(laneEl.dataset.index);
    const camel = core.getState().camels[idx];
    if (!camel) return;
    // Empty / >16-char input is rejected by the core; state (and header) stay.
    core.setCamelName(camel.id, input.value);
  });

  // A rejected (empty or >16-char) value is never stored, so a cleared field can
  // linger blank while the lane header keeps the old name. On blur, resync the
  // field from core state so it never desyncs.
  laneContainer.addEventListener('focusout', function (ev) {
    const input = ev.target.closest('[data-name-input]');
    if (!input) return;
    const laneEl = input.closest('.lane');
    const idx = Number(laneEl.dataset.index);
    const camel = core.getState().camels[idx];
    if (camel) input.value = camel.name;
  });

  camelCountEl.addEventListener('change', function () {
    const v = Number(camelCountEl.value);
    if (Number.isFinite(v)) core.setCamelCount(Math.floor(v));
    camelCountEl.value = String(core.getState().camelCount);
  });

  goalEl.addEventListener('change', function () {
    const v = Number(goalEl.value);
    if (Number.isInteger(v) && v >= GameCore.GOAL_MIN && v <= GameCore.GOAL_MAX) {
      if (core.setGoal(v)) { lastGoal = v; hideValidation(); }
    } else {
      goalEl.value = String(core.getState().goalScore != null ? core.getState().goalScore : lastGoal);
    }
  });

  infiniteEl.addEventListener('change', function () {
    if (infiniteEl.checked) {
      const g = core.getState().goalScore;
      if (g != null) lastGoal = g;
      core.setGoal(null);
    } else {
      core.setGoal(lastGoal);
    }
  });

  // Every legend char resolves through the sprite's own palette first (forest
  // decor sprites key by their own letters), then the shared semantic CHAR_KEY.
  const CHAR_KEY = {
    O: 'outline', B: 'body', S: 'shade', G: 'harness', R: 'robe',
    W: 'eyeWhite', K: 'skin', L: 'blanket',
    D: 'bristle', H: 'highlight', E: 'ear', T: 'tusk', Y: 'eye', C: 'cap',

  function drawSprite(rows, x, y, palette) {
    const ox = Math.round(x);
    const oy = Math.round(y);
    for (let ry = 0; ry < rows.length; ry++) {
      const row = rows[ry];
      // One fillRect per contiguous same-colour run in the row: sprites have
      // 3-5 colours, so a row collapses to a handful of runs. A transparent
      // '.' (or an unresolved colour) ends the run. Colour resolution order is
      // unchanged: palette[ch] → palette[CHAR_KEY[ch]] → COL[CHAR_KEY[ch]].
      let runStart = -1;
      let runColor;
      for (let rx = 0; rx < row.length; rx++) {
        const ch = row[rx];
        let color;
        if (ch !== '.') {
          const key = CHAR_KEY[ch];
          if (palette && palette[ch] !== undefined) color = palette[ch];
          else if (palette && key && palette[key] !== undefined) color = palette[key];
          else if (key && COL[key] !== undefined) color = COL[key];
        }
        if (color === runColor) continue; // same colour (or both transparent)
        if (runStart !== -1) { // colour change / gap: flush the open run
          ctx.fillStyle = runColor;
          ctx.fillRect(ox + runStart, oy + ry, rx - runStart, 1);
          runStart = -1;
        }
        // Re-seat the run colour even for a gap, so the next same-colour cell
        // starts a fresh run instead of matching a stale colour identity.
        runColor = color;
        if (color !== undefined) runStart = rx;
      }
      if (runStart !== -1) {
        ctx.fillStyle = runColor;
        ctx.fillRect(ox + runStart, oy + ry, row.length - runStart, 1);
      }
    }
  }

  function hash2(a, b) {
    let h = (a * 374761393 + b * 668265263) | 0;
    h = (h ^ (h >>> 13)) | 0;
    h = Math.imul(h, 1274126177);
    return (h ^ (h >>> 16)) >>> 0;
  }

  function mulberry32(seed) {
    let a = seed | 0;
    return function () {
      a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // Non-allocating counterpart to mulberry32 for the hot grass-carpet loop: the
  // same sequence, but seeded/read through module-level scratch instead of a
  // closure, so a speckle pass allocates nothing.
  let prngState = 0;
  function seedPrng(seed) { prngState = seed | 0; }
  function nextPrng() {
    prngState = (prngState + 0x6D2B79F5) | 0;
    let t = Math.imul(prngState ^ (prngState >>> 15), 1 | prngState);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }

  function drawSky() {
    const bands = theme.palette.sky;
    const bandH = Math.ceil(HORIZON_Y / bands.length);
    for (let i = 0; i < bands.length; i++) {
      ctx.fillStyle = bands[i];
      ctx.fillRect(0, i * bandH, CANVAS_W, bandH);
    }
  }

  // Celestial disc in the sky: the desert sun and the forest dusk moon share this
  // slot (centre 1020,76 r32), so the name is theme-neutral.
  function drawCelestial() {
    const cx = 1020, cy = 76, r = 32; // 2x for the 120px sky
    for (let dy = -r; dy <= r; dy++) {
      const span = Math.floor(Math.sqrt(r * r - dy * dy));
      ctx.fillStyle = (Math.abs(dy) > r - 6) ? theme.palette.sunRim : theme.palette.sun;
      ctx.fillRect(cx - span, cy + dy, span * 2 + 1, 1);
    }
  }

  function drawDuneBand(baseY, offset, color) {
    ctx.fillStyle = color;
    for (let x = 0; x < CANVAS_W; x++) {
      const tt = (x + offset) * 0.05;
      const h = 6 + Math.round(Math.sin(tt) * 4 + Math.sin(tt * 0.5) * 2);
      const top = baseY - h;
      ctx.fillRect(x, top, 1, HORIZON_Y - top + 2);
    }
  }

  function drawDunes(win) {
    // Distant background silhouettes just above the horizon; per-theme colors
    // (desert dunes / forest hillside). Forest ships none (pure sky + treeline).
    const distant = theme.palette.distant;
    if (!distant || distant.length < 2) return;
    drawDuneBand(HORIZON_Y - 18, (win.min * 0.3) % 120, distant[0]);
    drawDuneBand(HORIZON_Y - 6, (win.min * 0.6) % 90, distant[1]);
  }

  // Draw one decor pass from the theme's per-layer streams (docs/art/theme-art.md
  // §3.4 forest / §2.11 desert). Called per pass: background BEFORE drawLanes,
  // floor + midground AFTER, so on-lane pixels land on the opaque lane fill.

  // Midground sprite anchors recorded per frame for tests (occlusion proof):
  // reset with the background pass, filled by the midground pass. Fixed size, so
  // recording never grows the heap.
  const midgroundXBuf = new Float64Array(16);
  const midgroundYBuf = new Float64Array(16);
  let midgroundDrawnCount = 0;

  function drawDecor(win, layer) {
    const decor = theme.decor;
    // Bookkeeping spans all passes: reset on the background pass, accumulate on
    // floor + midground, so getScene() still describes the whole frame (every
    // family, drawn count bounded by the layer caps).
    if (layer === 'background') {
      runtime.decorKinds = []; runtime.decorDrawn = 0; midgroundDrawnCount = 0; runtime.decorFlat = 0;
      runtime.decorLayers = { background: 0, midground: 0, floor: 0 };
    }
    // Zoomed out past maxSpan the window spans too many decoration cells
    // to draw cheaply; skip world decor (sky/ground/carpet stay, cheap bands).
    if ((win.max - win.min) > decor.maxSpan) return;
    drawStreamLayer(win, layer, decor);
  }

  // One per-layer stream: background (HORIZON_Y anchored), midground (random lane)
  // or floor (per lane). Draw order per candidate is roll → jitter → lane, exactly
  // the shipped order, so the streams are reproducible and deterministic.
  function drawStreamLayer(win, layer, decor) {
    const spec = decor.streams[layer];
    if (!spec) return;
    const kinds = [];
    for (const k of decor.kinds) if (k.layer === layer) kinds.push(k);
    if (kinds.length === 0) return;
    let total = 0;
    for (const k of kinds) total += k.weight;
    const W = win.max - win.min;
    const margin = W * (16 / CANVAS_W);
    const spacing = spec.spacing;
    const startK = Math.floor((win.min - spacing) / spacing);
    const endK = Math.ceil((win.max + spacing) / spacing);
    const laneCount = core.getState().camels.length;
    const isFloor = (layer === 'floor');
    const lanes = isFloor ? Math.max(1, laneCount) : 1;
    // Spread the layer cap evenly across the per-lane floor streams so no lane
    // starves at wide zoom (the old lane-order cap let the top lanes eat all
    // 120). Non-floor layers have one stream, so perLaneCap == spec.cap there.
    // laneCap * lanes <= spec.cap, so the documented total bound still holds.
    const perLaneCap = Math.max(1, Math.floor(spec.cap / lanes));
    // Sample the cap across the WHOLE window rather than walking k from the left
    // edge and breaking (which bunched every prop into the window's left ~20% at
    // wide zoom). Each cell seeds independently, so determinism (same input →
    // same output) and world-anchoring (fixed world position per cell) hold.
    const step = Math.max(1, Math.ceil((endK - startK + 1) / perLaneCap));
    let drawn = 0;
    for (let lane = 0; lane < lanes; lane++) {
      let laneDrawn = 0;
      for (let k = startK; k <= endK; k += step) {
        if (laneDrawn >= perLaneCap) break;
        // Reuse the module PRNG scratch (no closure per candidate); the
        // seed/next sequence is identical to mulberry32(seed).
        const key = isFloor ? (k * FLOOR_LANES + lane) : k;
        seedPrng(hash2(SEED ^ decor.salts[layer], key));
        const roll = nextPrng() * total;
        const point = k * spacing + Math.floor(nextPrng() * (spacing / 2) - spacing / 4);
        if (point < win.min - margin || point > win.max + margin) continue;
        let acc = 0, chosen = kinds[kinds.length - 1];
        for (const kind of kinds) { acc += kind.weight; if (roll <= acc) { chosen = kind; break; } }
        let anchorLane = 0;
        if (isFloor) anchorLane = lane;
        else if (layer === 'midground' && laneCount > 0) anchorLane = Math.floor(nextPrng() * laneCount);
        const cx = mapX(point, win);
        // `flat:true` kinds (§2.14) roam the lane field: the top edge is seeded
        // between laneTop + 8 and laneBottom - 6 - spriteH with one extra
        // nextPrng() draw. Rooted kinds keep the lane-surface anchor and their
        // PRNG draw order — the forest never sets `flat`, so its pixels hold.
        let anchorY;
        if (layer === 'background') anchorY = HORIZON_Y;
        else if (chosen.flat) {
          const room = laneHeight(laneCount) - FLAT_TOP - FLAT_BOTTOM - chosen.sprite.length;
          anchorY = laneTopY(anchorLane, laneCount) + FLAT_TOP + Math.floor(nextPrng() * (Math.max(0, room) + 1));
        } else anchorY = laneSurfaceY(anchorLane, laneCount, point);
        drawSprite(chosen.sprite, cx - chosen.sprite[0].length / 2, anchorY + (chosen.yOffset || 0), chosen.pal);
        if (layer === 'midground' && midgroundDrawnCount < midgroundXBuf.length) {
          midgroundXBuf[midgroundDrawnCount] = cx;
          midgroundYBuf[midgroundDrawnCount] = anchorY;
          midgroundDrawnCount++;
        }
        if (runtime.decorKinds.indexOf(chosen.kind) < 0) runtime.decorKinds.push(chosen.kind);
        if (chosen.flat) runtime.decorFlat += 1;
        drawn++;
        laneDrawn++;
      }
      if (drawn >= spec.cap) break;
    }
    runtime.decorDrawn += drawn;
    runtime.decorLayers[layer] += drawn;
  }

  // Ground carpet: cheap procedural speckle (1-2 plain fillRects every ~10 px per
  // lane, docs/art/theme-art.md §3.4.2 grass / §2.8 sand). Never culled, so the
  // floor still reads as grass/sand when props thin out; no sprite loop, no
  // per-speckle allocation. Tones + grain come from the theme's ground tokens:
  // forest 50/50 1 px (#5a8a48/#3a6030), desert 60/40 1-2 px (#dcb87a/#b8935a).
  function drawGroundCarpet(s, win) {
    const ground = theme.ground;
    if (!ground.speckle) return;
    const dark = ground.ripple ?? ground.shade; // forest ships no ripple (§2.8)
    const share = ground.speckleShare || 0.5;
    const speckleW = ground.speckleWidth || 1;
    const n = s.camels.length;
    const heights = terrainHeightBuf; // computed by drawLanes this frame
    // World-anchor the carpet: keep ~CARPET_SPACING on-screen px between
    // speckle columns, but derive the world-space spacing from the current
    // window so the pattern scrolls with the ground (a screen-space pattern
    // stayed frozen while the lanes panned). Cells are seeded by world index.
    const span = Math.max(1e-6, win.max - win.min);
    // v2 carpet pitch (§2.8): desert ships `carpetSpacing: 7`; the forest keeps
    // the 10 px fallback so its carpet columns never move.
    const worldSpacing = span / CANVAS_W * (ground.carpetSpacing || CARPET_SPACING);
    const startK = Math.floor(win.min / worldSpacing);
    const endK = Math.ceil(win.max / worldSpacing);
    for (let i = 0; i < n; i++) {
      const top = Math.round(laneTopY(i, n));
      const bottom = Math.round(laneBottomY(i, n));
      for (let k = startK; k <= endK; k++) {
        seedPrng(hash2(SEED ^ theme.decor.carpetSalt, k * FLOOR_LANES + i));
        const world = k * worldSpacing + nextPrng() * worldSpacing;
        const px = Math.round(mapX(world, win));
        if (px < 0 || px >= CANVAS_W) continue;
        // Crest at this column follows the world-anchored terrain of the lane.
        let crest = Math.max(HORIZON_Y, top - heights[px]);
        if (crest > bottom - 2) crest = bottom - 2;
        const lo = crest + 5, hi = bottom - 2;
        if (hi <= lo) continue;
        const count = 1 + (nextPrng() < 0.5 ? 1 : 0);
        for (let j = 0; j < count; j++) {
          const y = lo + Math.floor(nextPrng() * (hi - lo));
          ctx.fillStyle = (nextPrng() < share) ? ground.speckle : dark;
          // Doc draw order: y → tone → width. Forest keeps 1 px and skips the
          // width draw entirely, so its PRNG sequence (and pixels) are unchanged.
          const w = (speckleW > 1) ? 1 + (nextPrng() < 0.5 ? 1 : 0) : 1;
          ctx.fillRect(px, y, w, 1);
        }
        // v2 grain cluster (§2.8): 3 px dark run + 1 lit pixel above it, at
        // `clusterShare` per column. Gated on `ground.ramp`, so the forest burns
        // no extra PRNG values and its carpet stays byte-identical.
        if (ground.ramp && nextPrng() < (ground.clusterShare || 0)) {
          const cy = lo + 1 + Math.floor(nextPrng() * Math.max(1, hi - lo - 2));
          ctx.fillStyle = dark;
          ctx.fillRect(px, cy, 3, 1);
          ctx.fillStyle = ground.speckle;
          ctx.fillRect(px + 1, cy - 1, 1, 1);
        }
      }
    }
  }

  function drawMilestones(win) {
    // Milestones are world decor: past the theme's decor maxSpan the window
    // spans too many 50-point cells to iterate cheaply (scores are unbounded),
    // so drop them like drawDecor does. Below the bound this is <= 30 iterations.
    if ((win.max - win.min) > theme.decor.maxSpan) return;
    ctx.font = '12px monospace';
    ctx.textBaseline = 'top';
    const start = Math.max(MILESTONE_STEP, Math.ceil(win.min / MILESTONE_STEP) * MILESTONE_STEP);
    for (let m = start; m <= win.max; m += MILESTONE_STEP) {
      const x = mapX(m, win) - 4;
      if (x < -24 || x > CANVAS_W + 24) continue;
      // Stand the flag on the terrain at its world position (20x28 sprite).
      const flagY = HORIZON_Y - 28 - Math.round(core.terrainHeightAt(m));
      drawSprite(MILESTONE, x, flagY, MILESTONE_PAL);
      // At high-but-allowed zoom a 50-point step can be narrower than the label,
      // so skip the number (flag still drawn) to avoid colliding labels.
      const label = String(m);
      const stepPx = mapX(m + MILESTONE_STEP, win) - mapX(m, win);
      if (stepPx < ctx.measureText(label).width + 8) continue;
      ctx.fillStyle = '#e8e0d0';
      ctx.fillText(label, x + 20, flagY + 8);
    }
  }

  function drawFinish(s, win) {
    if (!runtime.finishVisible || runtime.goalScreenX == null) return;
    // mapX clamps to [0,CANVAS_W], so a goal outside the window would otherwise
    // pin the flag clipped to the edge. Draw nothing until it scrolls into view.
    if (s.goalScore < win.min || s.goalScore > win.max) return;
    // Stand the pole on the terrain at the goal's world position.
    const poleTop = HORIZON_Y - Math.round(core.terrainHeightAt(s.goalScore));
    const x = Math.round(runtime.goalScreenX) - 6;
    drawSprite(FINISH_FLAG, x, poleTop - 28, FINISH_PAL);
    const stripeX = x + 8;
    // Checker parity is relative to the pole top so the stripe alternates
    // light/dark from its first row (matching the flag's checkered look).
    for (let y = poleTop; y < LANE_BOTTOM; y += 8) {
      ctx.fillStyle = (Math.floor((y - poleTop) / 8) % 2 === 0) ? COL.checkerLight : COL.checkerDark;
      ctx.fillRect(stripeX, y, 8, 8);
    }
  }

  function spawnConfetti(cx, cy) {
    for (let i = 0; i < CONFETTI_COUNT; i++) {
      const rng = mulberry32(hash2(CONFETTI_SEED, i));
      runtime.confetti.push({
        x: cx,
        y: cy,
        vx: (rng() * 2 - 1) * 120,
        vy: -(rng() * 120 + 60),
        color: CONFETTI_COLORS[i % CONFETTI_COLORS.length],
        age: 0,
        life: 900 + rng() * 300,
      });
    }
  }

  function updateConfetti(dt) {
    const alive = [];
    for (const p of runtime.confetti) {
      p.age += dt;
      p.vy += 280 * dt / 1000;
      p.x += p.vx * dt / 1000;
      p.y += p.vy * dt / 1000;
      if (p.age < p.life && p.y < CANVAS_H + 4 && p.x > -4 && p.x < CANVAS_W + 4) alive.push(p);
    }
    runtime.confetti = alive;
  }

  function drawConfetti() {
    runtime.confettiDrawn = runtime.confetti.length;
    for (const p of runtime.confetti) {
      ctx.fillStyle = p.color;
      ctx.fillRect(Math.round(p.x), Math.round(p.y), 4, 4);
    }
  }

  function drawBanner(s) {
    if (!s.raceOver || !s.winnerId) return;
    const idx = s.camels.findIndex(function (c) { return c.id === s.winnerId; });
    if (idx < 0) return; // Defense-in-depth: winner lane gone; draw nothing
    const text = t(s.language, 'winnerBanner', { name: s.camels[idx].name });
    ctx.font = '16px monospace';
    ctx.textBaseline = 'top';
    const w = Math.ceil(ctx.measureText(text).width) + 32;
    const x = Math.round((CANVAS_W - w) / 2);
    const y = 8;
    ctx.fillStyle = '#000000';
    ctx.fillRect(x - 2, y - 2, w + 4, 32);
    ctx.fillStyle = COL.flag;
    ctx.fillRect(x, y, w, 24);
    ctx.fillStyle = '#1a1208';
    ctx.fillText(text, x + 16, y + 4);
  }

  // Terrain height per canvas column, independent of lane: precompute once per
  // frame so 8 lanes do not each re-evaluate ~1280 sin pairs (pixel-identical).
  // The buffer is reused across frames: drawLanes consumes it synchronously
  // before the next terrainHeights call, so no per-frame allocation is needed.
  const terrainHeightBuf = new Int32Array(CANVAS_W);
  function terrainHeights(win) {
    const span = Math.max(1e-6, win.max - win.min);
    for (let x = 0; x < CANVAS_W; x++) {
      const worldX = win.min + ((x + 0.5) / CANVAS_W) * span;
      terrainHeightBuf[x] = Math.round(core.terrainHeightAt(worldX));
    }
    return terrainHeightBuf;
  }

  function drawLanes(s, win) {
    const n = s.camels.length;
    const heights = terrainHeights(win);
    for (let i = 0; i < n; i++) {
      const top = Math.round(laneTopY(i, n));
      const bottom = Math.round(laneBottomY(i, n));
      // Base ground fills the whole lane so there are never gaps between lanes.
      const ground = theme.ground;
      ctx.fillStyle = ground.top;
      ctx.fillRect(0, top, CANVAS_W, bottom - top);
      // v2 tone ramp (§2.12): 3 hard-edged zones at 40/60/80 % of the lane,
      // right after the base fill. Theme-gated (`ground.ramp`), so the forest
      // lane fill is untouched.
      const ramp = ground.ramp;
      if (ramp) {
        const laneH = bottom - top;
        for (let r = 0; r < ramp.length; r++) {
          const yA = top + Math.round((0.40 + 0.20 * r) * laneH);
          const yB = (r === ramp.length - 1) ? bottom : top + Math.round((0.40 + 0.20 * (r + 1)) * laneH);
          ctx.fillStyle = ramp[r];
          ctx.fillRect(0, yA, CANVAS_W, yB - yA);
        }
      }
      ctx.fillStyle = ground.edge;
      ctx.fillRect(0, bottom - 1, CANVAS_W, 1);
      for (let x = 0; x < CANVAS_W; x++) {
        const h = heights[x];
        // Undulating crest: rises above the lane top when h > 0 (lower lanes
        // drawn later overlap it), never poking above the horizon sky.
        let crest = Math.max(HORIZON_Y, top - h);
        if (crest > bottom - 2) crest = bottom - 2;
        ctx.fillStyle = ground.rim;
        ctx.fillRect(x, crest, 1, 1);
        ctx.fillStyle = ground.shade;
        ctx.fillRect(x, crest + 3, 1, 2);
      }
      // v2 dune streaks (§2.12): 3 sine bands per lane in `ground.shade`, drawn
      // after the crest pass so they never cross the rim/edge. Each band emits
      // one fillRect per equal-row run (≈100 runs/band/lane at 1×). Theme-gated
      // on `ground.ramp`; the wavelength tracks the camera window like the
      // carpet pitch, and lanes get a + i·0.17 phase so they never moiré.
      if (ramp) {
        const span = Math.max(1e-6, win.max - win.min);
        const laneH = bottom - top;
        for (const b of DUNE_STREAKS) {
          const periodWorld = span / CANVAS_W * b.periodPx;
          const y0 = top + Math.round(b.frac * laneH);
          let runX = 0, runY = null;
          for (let x = 0; x <= CANVAS_W; x++) {
            let y = runY;
            if (x < CANVAS_W) {
              const world = win.min + ((x + 0.5) / CANVAS_W) * span;
              let crest = Math.max(HORIZON_Y, top - heights[x]);
              if (crest > bottom - 2) crest = bottom - 2;
              y = y0 + Math.round(b.amp * Math.sin(2 * Math.PI * (world / periodWorld + b.phase + i * 0.17)));
              y = Math.min(Math.max(y, crest + 5), bottom - 2 - (b.thick - 1));
            }
            if (y !== runY) { // emit one fillRect per equal-row run
              if (runY !== null) { ctx.fillStyle = ground.shade; ctx.fillRect(runX, runY, x - runX, b.thick); }
              runX = x; runY = y;
            }
          }
          ctx.fillStyle = ground.shade;
          ctx.fillRect(runX, runY, CANVAS_W - runX, b.thick); // flush the final run
        }
      }
    }
    // Paint the rows below the last lane so no transparent strip remains.
    ctx.fillStyle = theme.ground.edge;
    ctx.fillRect(0, LANE_BOTTOM, CANVAS_W, CANVAS_H - LANE_BOTTOM);
  }

  function drawCamels(s, win, now) {
    const n = s.camels.length;
    s.camels.forEach(function (c, i) {
      const v = runtime.visualLeft[c.id];
      const left = (v == null) ? camelTargetLeft(c.score, win) : v;
      const frameIndex = (now < c.animUntil) ? (Math.floor(now / ANIM_FRAME_MS) % 4) + 1 : 0;
      const top = camelTopY(i, n, c.score);
      drawSprite(theme.animal.sprite[frameIndex], left, top, theme.animal.pal(c.color));
    });
  }

  // Team-name labels: a dark pill + light 12px monospace text above each animal.
  // Geometry is recomputed every frame from core state (never cached), so a
  // rename in the Team input redraws the label on the same frame, and each label
  // tracks its animal's lerped visualLeft. Bounds are clamped to the canvas.
  const TEAM_LABEL_FONT = '12px monospace';
  const TEAM_LABEL_TEXT = '#e8e0d0';
  const TEAM_LABEL_PILL = 'rgba(26,18,8,0.72)';
  const TEAM_LABEL_OUTLINE = 'rgba(0,0,0,0.55)';
  const TEAM_LABEL_H = 16; // pill height
  const TEAM_LABEL_GAP = 4; // pill bottom -> sprite top
  const TEAM_LABEL_PAD = 4; // pill left -> text left (8 px total)
  // Reused per-lane slots so a steady frame allocates no label objects.
  const teamLabelPool = [];
  function teamLabelSlot(i) {
    let o = teamLabelPool[i];
    if (o === undefined) {
      o = { id: '', name: '', x: 0, y: 0, w: 0, h: TEAM_LABEL_H };
      teamLabelPool[i] = o;
    }
    return o;
  }
  function drawTeamLabels(s, win) {
    const labels = runtime.teamLabels;
    labels.length = 0;
    ctx.font = TEAM_LABEL_FONT;
    ctx.textBaseline = 'top';
    const n = s.camels.length;
    for (let i = 0; i < n; i++) {
      const c = s.camels[i];
      const v = runtime.visualLeft[c.id];
      const left = (v == null) ? camelTargetLeft(c.score, win) : v;
      const text = c.name;
      const w = Math.ceil(ctx.measureText(text).width) + TEAM_LABEL_PAD * 2;
      // Centered on the animal's visual centre (same value the sprite uses).
      let x = Math.round(left + SPRITE_W / 2 - w / 2);
      if (x < 0) x = 0; else if (x + w > CANVAS_W) x = CANVAS_W - w;
      // Just above the sprite's top. camelTopY >= HORIZON_Y by construction, so
      // both y clamps are currently unreachable; kept as defensive guards in
      // case camelTopY's formula changes (e.g. an above-horizon lane).
      let y = Math.round(camelTopY(i, n, c.score) - TEAM_LABEL_GAP - TEAM_LABEL_H);
      if (y < 0) y = 0; else if (y + TEAM_LABEL_H > CANVAS_H) y = CANVAS_H - TEAM_LABEL_H;
      ctx.fillStyle = TEAM_LABEL_OUTLINE;
      // Clamp the 1px outline so a left/top-clamped lane (x==0/y==0) does not
      // paint its outer row/column off-canvas; pill and text geometry unchanged.
      ctx.fillRect(Math.max(0, x - 1), Math.max(0, y - 1), w + 2, TEAM_LABEL_H + 2);
      ctx.fillStyle = TEAM_LABEL_PILL;
      ctx.fillRect(x, y, w, TEAM_LABEL_H);
      ctx.fillStyle = TEAM_LABEL_TEXT;
      ctx.fillText(text, x + TEAM_LABEL_PAD, y + 2);
      const slot = teamLabelSlot(i);
      slot.id = c.id; slot.name = text; slot.x = x; slot.y = y; slot.w = w; slot.h = TEAM_LABEL_H;
      labels.push(slot);
    }
  }

  function updateRuntime(s, dt, now) {
    const win = runtime.frameWindow;
    for (const c of s.camels) {
      const target = camelTargetLeft(c.score, win);
      const v = runtime.visualLeft[c.id];
      const m = runtime.motion[c.id];
      if (v == null || m == null) {
        runtime.visualLeft[c.id] = target;
        runtime.motion[c.id] = { from: target, target: target, start: now };
        continue;
      }
      if (Math.abs(m.target - target) > 0.01) {
        // Retarget mid-flight: ease from where the sprite is right now.
        m.from = v;
        m.target = target;
        m.start = now;
      }
      const p = Math.min(1, (now - m.start) / LERP_MS);
      const eased = 1 - Math.pow(1 - p, 3);
      runtime.visualLeft[c.id] = (p >= 1) ? m.target : m.from + (m.target - m.from) * eased;
    }
    const ids = new Set(s.camels.map(function (c) { return c.id; }));
    for (const id of Object.keys(runtime.visualLeft)) {
      if (!ids.has(id)) { delete runtime.visualLeft[id]; delete runtime.motion[id]; }
    }

    const winnerIdx = (s.raceOver && s.winnerId)
      ? s.camels.findIndex(function (c) { return c.id === s.winnerId; })
      : -1;
    if (s.raceOver && s.winnerId && winnerIdx < 0) {
      // Defense-in-depth: winner camel removed (e.g. a camel-count shrink); drop
      // any burst and
      // stop tracking so nothing dereferences a lane that no longer exists.
      runtime.lastWinnerId = null;
      runtime.confetti = [];
    } else if (s.raceOver && s.winnerId && runtime.lastWinnerId !== s.winnerId) {
      runtime.lastWinnerId = s.winnerId;
      const c = s.camels[winnerIdx];
      const cx = (runtime.visualLeft[c.id] == null ? camelTargetLeft(c.score, win) : runtime.visualLeft[c.id]) + SPRITE_W / 2;
      spawnConfetti(cx, laneSurfaceY(winnerIdx, s.camels.length, c.score) - 4);
    }
    if (!s.raceOver && runtime.lastWinnerId !== null) {
      runtime.lastWinnerId = null;
      runtime.confetti = [];
    }

    updateConfetti(dt);

    runtime.finishVisible = !s.infinite && s.goalScore != null;
    runtime.goalScreenX = runtime.finishVisible ? mapX(s.goalScore, win) : null;
  }

  // Render order (docs/art/theme-art.md §2.11.2 / §3.4.3): sky → celestial →
  // dunes → background decor → milestones → lanes → ground carpet → floor props →
  // midground → animals → team labels → finish → confetti → banner. Animals last
  // over the midground so they read in front of in-track scenery.
  function drawScene(s, win, now) {
    drawSky();
    drawCelestial();
    drawDunes(win);
    drawDecor(win, 'background');
    drawMilestones(win);
    drawLanes(s, win);
    drawGroundCarpet(s, win);
    drawDecor(win, 'floor');
    drawDecor(win, 'midground');
    drawCamels(s, win, now);
    drawTeamLabels(s, win);
    drawFinish(s, win);
    drawConfetti();
    drawBanner(s);
  }

  let last = performance.now();
  let frameErrorLogged = false; // rate-limit: one log per error occurrence
  function frame(now) {
    try {
      syncTheme();
      const dt = Math.min(50, now - last);
      last = now;
      const s = core.getState();
      const win = currentWindow(s);
      runtime.frameWindow = win;
      updateRuntime(s, dt, now);
      drawScene(s, win, now);
      frameErrorLogged = false; // a clean frame re-arms logging
    } catch (err) {
      // A single bad frame must not kill the loop; the next frame re-schedules.
      // Log once per occurrence so a persistent render error is not 60x/s spam.
      if (!frameErrorLogged) {
        frameErrorLogged = true;
        console.error(err);
      }
    } finally {
      window.requestAnimationFrame(frame);
    }
  }

  window.GameDebug = {
    getState: function () { return core.getState(); },
    getCameraWindow: function () {
      const w = runtime.frameWindow || currentWindow(core.getState());
      return { min: w.min, max: w.max };
    },
    getCanvasSize: function () { return { width: CANVAS_W, height: CANVAS_H }; },
    getCanvasLayout: function () {
      return {
        scale: canvasScale,
        bufferWidth: CANVAS_W,
        bufferHeight: CANVAS_H,
        cssWidth: parseFloat(canvas.style.width) || CANVAS_W,
        cssHeight: parseFloat(canvas.style.height) || CANVAS_H,
        wrapperWidth: canvasWrap.clientWidth,
        wrapperHeight: canvasWrap.clientHeight,
      };
    },
    getCamelSpriteBounds: function () {
      const s = core.getState();
      const win = runtime.frameWindow || currentWindow(s);
      const n = s.camels.length;
      return s.camels.map(function (c, i) {
        const v = runtime.visualLeft[c.id];
        const left = (v == null) ? camelTargetLeft(c.score, win) : v;
        const top = camelTopY(i, n, c.score);
        return { id: c.id, lane: i, left: left, right: left + SPRITE_W, top: top, bottom: top + SPRITE_H };
      });
    },
    isSettled: function () {
      const s = core.getState();
      const win = runtime.frameWindow || currentWindow(s);
      // Honest: a lane with no runtime.visualLeft entry has not yet been drawn
      // by a frame (updateRuntime seeds it on the frame that paints the lane),
      // so the previous frame's pixels/geometry are stale -- report unsettled
      // until every CURRENT lane has been painted and reached its target.
      // Removed lanes must not block: we iterate s.camels (current ids only), so
      // a deleted id lingering in runtime.visualLeft is simply never inspected.
      return s.camels.every(function (c) {
        const v = runtime.visualLeft[c.id];
        if (v == null) return false;
        return Math.abs(v - camelTargetLeft(c.score, win)) <= 0.5;
      });
    },
    getTheme: function () {
      syncTheme();
      return { id: theme.id, animalId: theme.animal.id, w: theme.animal.w, h: theme.animal.h };
    },
    getScene: function () {
      const midground = [];
      for (let i = 0; i < midgroundDrawnCount; i++) {
        midground.push({ x: midgroundXBuf[i], y: midgroundYBuf[i] });
      }
      const teamLabels = (runtime.teamLabels || []).map(function (l) {
        return { id: l.id, name: l.name, x: l.x, y: l.y, w: l.w, h: l.h };
      });
      const decorLayers = runtime.decorLayers || { background: 0, midground: 0, floor: 0 };
      return { finishVisible: runtime.finishVisible, goalScreenX: runtime.goalScreenX, decorDrawn: runtime.decorDrawn, decorFlat: runtime.decorFlat, decorLayers: { background: decorLayers.background, midground: decorLayers.midground, floor: decorLayers.floor }, decorKinds: (runtime.decorKinds || []).slice(), midground: midground, confettiDrawn: runtime.confettiDrawn, teamLabels: teamLabels };
    },
  };

  // ---------- persistence wiring + boot (restore before first paint) ----------
  const SAVE_DEBOUNCE_MS = 200;
  const storageOk = GameStorage.available();
  let saveTimer = null;
  function scheduleSave() {
    if (!storageOk) return;
    if (saveTimer != null) clearTimeout(saveTimer);
    saveTimer = setTimeout(function () { saveTimer = null; GameStorage.save(); }, SAVE_DEBOUNCE_MS);
  }
  function flushSave() {
    // Only flush an outstanding debounce; a no-op pagehide must never overwrite
    // the stored blob (e.g. a forward-compat unknown-version payload).
    if (saveTimer == null) return;
    clearTimeout(saveTimer);
    saveTimer = null;
    if (storageOk) GameStorage.save();
  }
  window.addEventListener('pagehide', flushSave);
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'hidden') flushSave();
  });

  // registerThemeIds must run before load() so a persisted `forest` theme
  // validates against the live registry (single source of truth).
  GameCore.registerThemeIds(Object.keys(THEMES));
  // Restore before building/refreshing the DOM and before the first frame, so
  // no default theme/language flashes. load() emits with no subscribers yet.
  if (storageOk) GameStorage.load();
  // A restored finished race shows the banner but must NOT replay confetti:
  // seed the winner tracker so updateRuntime sees no live transition.
  if (core.getState().raceOver) runtime.lastWinnerId = core.getState().winnerId;

  core.subscribe(syncDom);
  core.subscribe(scheduleSave); // never fires on load (no emit after subscribe)
  hideValidation();
  syncTheme();
  syncDom(core.getState());

  window.requestAnimationFrame(frame);

  // Fit the canvas once now, and again on viewport/wrapper changes (rAF-debounced).
  applyCanvasLayout();
  window.addEventListener('resize', requestLayout);
  if (typeof ResizeObserver !== 'undefined') {
    const ro = new ResizeObserver(requestLayout);
    ro.observe(canvasWrap);
  }
})();
</script>
</body>
</html>
